<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Forma</title>
  <meta name="description" content="Dziennik treningowy: plany, serie, przerwy, postępy i pomiary. Wszystko zapisane na Twoim urządzeniu." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#F2F2F7" id="meta-theme" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Forma" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <style>
    /* ============================================================
       Tokeny
       ============================================================ */
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);

      --bg: #F2F2F7;
      --surface: #FFFFFF;
      --fill: rgba(120, 120, 128, 0.12);
      --fill-strong: rgba(120, 120, 128, 0.22);
      --label: #000000;
      --label-2: #5E5E63;
      --label-3: #A1A1A6;
      --separator: rgba(60, 60, 67, 0.17);

      --accent: #007AFF;
      --accent-text: #0062CC;
      --accent-soft: rgba(0, 122, 255, 0.12);
      --green: #34C759;
      --green-text: #1E7B34;
      --red: #FF3B30;
      --red-text: #D70015;
      --red-soft: rgba(255, 59, 48, 0.12);

      --lvl-0: rgba(120, 120, 128, 0.14);
      --lvl-1: rgba(52, 199, 89, 0.30);
      --lvl-2: rgba(52, 199, 89, 0.62);
      --lvl-3: #34C759;

      --glass: rgba(250, 250, 252, 0.74);
      --glass-edge: rgba(255, 255, 255, 0.75);
      --seg-thumb: #FFFFFF;
      --scrim: rgba(0, 0, 0, 0.28);
      --shadow-float: 0 10px 30px rgba(0, 0, 0, 0.10), 0 1px 3px rgba(0, 0, 0, 0.06);
      --toast-bg: rgba(28, 28, 30, 0.94);

      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);

      --radius-card: 1.15rem;
      --tabbar-h: 3.75rem;
      --content-w: 34rem;
    }

    html[data-theme="dark"] {
      --bg: #000000;
      --surface: #1C1C1E;
      --fill: rgba(120, 120, 128, 0.24);
      --fill-strong: rgba(120, 120, 128, 0.38);
      --label: #FFFFFF;
      --label-2: #AEAEB2;
      --label-3: #636366;
      --separator: rgba(84, 84, 88, 0.6);
      --accent: #0A84FF;
      --accent-text: #4DA3FF;
      --accent-soft: rgba(10, 132, 255, 0.22);
      --green: #30D158;
      --green-text: #30D158;
      --red: #FF453A;
      --red-text: #FF6961;
      --red-soft: rgba(255, 69, 58, 0.2);
      --lvl-0: rgba(120, 120, 128, 0.26);
      --lvl-1: rgba(48, 209, 88, 0.32);
      --lvl-2: rgba(48, 209, 88, 0.64);
      --lvl-3: #30D158;
      --glass: rgba(38, 38, 40, 0.74);
      --glass-edge: rgba(255, 255, 255, 0.10);
      --seg-thumb: #636366;
      --scrim: rgba(0, 0, 0, 0.5);
      --shadow-float: 0 10px 30px rgba(0, 0, 0, 0.5);
      --toast-bg: rgba(58, 58, 60, 0.96);
    }

    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) {
        --bg: #000000;
        --surface: #1C1C1E;
        --fill: rgba(120, 120, 128, 0.24);
        --fill-strong: rgba(120, 120, 128, 0.38);
        --label: #FFFFFF;
        --label-2: #AEAEB2;
        --label-3: #636366;
        --separator: rgba(84, 84, 88, 0.6);
        --accent: #0A84FF;
        --accent-text: #4DA3FF;
        --accent-soft: rgba(10, 132, 255, 0.22);
        --green: #30D158;
        --green-text: #30D158;
        --red: #FF453A;
        --red-text: #FF6961;
        --red-soft: rgba(255, 69, 58, 0.2);
        --lvl-0: rgba(120, 120, 128, 0.26);
        --lvl-1: rgba(48, 209, 88, 0.32);
        --lvl-2: rgba(48, 209, 88, 0.64);
        --lvl-3: #30D158;
        --glass: rgba(38, 38, 40, 0.74);
        --glass-edge: rgba(255, 255, 255, 0.10);
        --seg-thumb: #636366;
        --scrim: rgba(0, 0, 0, 0.5);
        --shadow-float: 0 10px 30px rgba(0, 0, 0, 0.5);
        --toast-bg: rgba(58, 58, 60, 0.96);
      }
    }

    /* Kolory okresów (kolory systemowe iOS) */
    .pc-amber  { --pc: #FF9500; --pc-soft: rgba(255, 149, 0, 0.18);  --pc-text: #A35200; }
    .pc-sky    { --pc: #32ADE6; --pc-soft: rgba(50, 173, 230, 0.18); --pc-text: #006E9C; }
    .pc-purple { --pc: #AF52DE; --pc-soft: rgba(175, 82, 222, 0.16); --pc-text: #8A35BC; }
    .pc-rose   { --pc: #FF2D55; --pc-soft: rgba(255, 45, 85, 0.14);  --pc-text: #CC1440; }
    .pc-teal   { --pc: #00C7BE; --pc-soft: rgba(0, 199, 190, 0.18);  --pc-text: #00736D; }
    html[data-theme="dark"] .pc-amber  { --pc-text: #FFB340; }
    html[data-theme="dark"] .pc-sky    { --pc-text: #70D7FF; }
    html[data-theme="dark"] .pc-purple { --pc-text: #DA8FFF; }
    html[data-theme="dark"] .pc-rose   { --pc-text: #FF6482; }
    html[data-theme="dark"] .pc-teal   { --pc-text: #66D4CF; }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) .pc-amber  { --pc-text: #FFB340; }
      html:not([data-theme="light"]) .pc-sky    { --pc-text: #70D7FF; }
      html:not([data-theme="light"]) .pc-purple { --pc-text: #DA8FFF; }
      html:not([data-theme="light"]) .pc-rose   { --pc-text: #FF6482; }
      html:not([data-theme="light"]) .pc-teal   { --pc-text: #66D4CF; }
    }

    /* ============================================================
       Podstawy. Rozmiar tekstu idzie za ustawieniem iOS.
       ============================================================ */
    html {
      font-size: 106.25%;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      background: var(--bg);
    }
    @supports (font: -apple-system-body) {
      html { font: -apple-system-body; }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--label);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
      font-size: 1rem;
      line-height: 1.3;
      -webkit-font-smoothing: antialiased;
    }
    html.locked, html.locked body { overflow: hidden; }
    h1, h2, h3, p, ul { margin: 0; padding: 0; }
    ul { list-style: none; }
    svg { display: block; }
    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      margin: 0;
      text-align: inherit;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    button:disabled { cursor: default; opacity: 0.35; }
    input, select, textarea { font: inherit; font-size: max(1rem, 16px); color: var(--label); }
    :focus { outline: none; }
    :focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
    .sr-only {
      position: absolute !important;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
    .ic { width: 1.25rem; height: 1.25rem; flex-shrink: 0; }

    /* ============================================================
       Pasek górny i duży tytuł
       ============================================================ */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      padding-top: var(--safe-top);
    }
    .topbar::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--glass);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      backdrop-filter: blur(20px) saturate(180%);
      box-shadow: 0 0.5px 0 var(--separator);
      opacity: 0;
      transition: opacity 200ms ease;
    }
    html.scrolled .topbar::before { opacity: 1; }
    .topbar-inner {
      position: relative;
      max-width: var(--content-w);
      height: 3.25rem;
      margin: 0 auto;
      padding: 0 0.75rem;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.5rem;
    }
    .topbar-side { display: flex; align-items: center; gap: 0.5rem; }
    .topbar-side.end { justify-content: flex-end; }
    .topbar-title {
      max-width: 50vw;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      transform: translateY(0.25rem);
      transition: opacity 200ms ease, transform 240ms var(--ease-out);
    }
    html.scrolled .topbar-title { opacity: 1; transform: none; }

    .nav-btn {
      min-width: 2.6rem;
      height: 2.6rem;
      padding: 0 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: var(--glass);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      backdrop-filter: blur(16px) saturate(180%);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08), inset 0 0 0 0.5px var(--glass-edge);
      color: var(--accent-text);
      font-weight: 600;
      font-size: 0.94rem;
      transition: transform 160ms var(--ease-out);
    }
    .nav-btn.icon { width: 2.6rem; padding: 0; }
    .nav-btn .ic { width: 1.3rem; height: 1.3rem; stroke-width: 2.3; }
    .nav-btn:active { transform: scale(0.92); }

    .large-title {
      max-width: var(--content-w);
      margin: 0 auto;
      padding: 0 1.25rem 1rem;
    }
    .large-title h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.022em;
      line-height: 1.12;
    }
    .large-title p { margin-top: 0.15rem; color: var(--label-2); font-size: 0.94rem; }

    main {
      max-width: var(--content-w);
      margin: 0 auto;
      padding: 0 1rem calc(var(--tabbar-h) + var(--safe-bottom) + 2.5rem);
    }

    /* ============================================================
       Sekcje, karty, listy
       ============================================================ */
    .section { margin-bottom: 1.75rem; }
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0 0.25rem 0.5rem;
    }
    .section-title { font-size: 1.18rem; font-weight: 700; letter-spacing: -0.01em; }
    .section-action {
      padding: 0.5rem 0.4rem;
      margin: -0.5rem -0.4rem;
      color: var(--accent-text);
      font-size: 0.94rem;
    }
    .group-label { padding: 0 1rem 0.4rem; font-size: 0.8rem; color: var(--label-2); }
    .group-note { padding: 0.5rem 1rem 0; font-size: 0.8rem; line-height: 1.38; color: var(--label-2); }
    .group { margin-bottom: 1.75rem; }

    .card {
      background: var(--surface);
      border-radius: var(--radius-card);
      overflow: hidden;
    }
    .card + .card { margin-top: 1rem; }
    .section > .card + .card, .sheet-body .card { margin-top: 0; }
    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.9rem 1rem 0.5rem;
    }
    .card-title { font-size: 1rem; font-weight: 600; }
    .card-sub { margin-top: 0.1rem; font-size: 0.8rem; color: var(--label-2); }
    .card-empty { padding: 0.25rem 1rem 1rem; color: var(--label-2); font-size: 0.94rem; }
    .badge {
      flex-shrink: 0;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: var(--fill);
      font-size: 0.8rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .list > li { position: relative; }
    .list > li + li::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      left: var(--sep, 1rem);
      border-top: 0.5px solid var(--separator);
      pointer-events: none;
    }
    .list.with-check { --sep: 3.65rem; }

    .row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-height: 2.85rem;
      padding: 0.55rem 1rem;
      transition: background-color 300ms ease;
    }
    .row:has(> .row-main:active) { background: var(--fill); transition: none; }
    .row-main {
      flex: 1;
      min-width: 0;
      align-self: stretch;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: -0.55rem -1rem -0.55rem 0;
      padding: 0.55rem 1rem 0.55rem 0;
    }
    .row > .row-main:first-child { margin-left: -1rem; padding-left: 1rem; }
    .row-text { flex: 1; min-width: 0; display: block; }
    .row-title { display: block; line-height: 1.25; overflow-wrap: anywhere; }
    .row-title.accent { color: var(--accent-text); }
    .row-title.danger { color: var(--red-text); }
    .row-title.muted, .row.is-done .row-title { color: var(--label-2); }
    .row-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.15rem 0.6rem;
      margin-top: 0.18rem;
      font-size: 0.8rem;
      line-height: 1.3;
      color: var(--label-2);
    }
    .meta-item { display: inline-flex; align-items: center; gap: 0.25rem; }
    .meta-item .ic { width: 0.85rem; height: 0.85rem; }
    .meta-alert { color: var(--red-text); font-weight: 600; }
    .row-value { flex-shrink: 0; color: var(--label-2); font-size: 0.94rem; }
    .chev { width: 0.95rem; height: 0.95rem; color: var(--label-3); stroke-width: 2.4; }
    @media (hover: hover) and (pointer: fine) {
      .row:has(> .row-main:hover) { background: var(--fill); }
    }

    /* Odhaczanie */
    .check {
      flex-shrink: 0;
      width: 2.75rem;
      height: 2.75rem;
      margin: -0.5rem -0.25rem -0.5rem -0.6rem;
      display: grid;
      place-items: center;
    }
    .check-ring {
      width: 1.55rem;
      height: 1.55rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 2px solid var(--label-3);
      transition: background-color 180ms ease, border-color 180ms ease, transform 160ms var(--ease-out);
    }
    .check.square .check-ring { border-radius: 0.45rem; }
    .check .ic {
      width: 0.95rem;
      height: 0.95rem;
      color: #FFFFFF;
      stroke-width: 3;
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 150ms ease, transform 220ms var(--ease-out);
    }
    .check.is-important .check-ring { border-color: var(--accent); }
    .check.is-missed .check-ring { border-color: var(--red); }
    .check[aria-checked="true"] .check-ring { background: var(--green); border-color: var(--green); }
    .check[aria-checked="true"] .ic { opacity: 1; transform: none; }
    .check:active .check-ring { transform: scale(0.84); transition-duration: 80ms; }

    /* Postęp dnia */
    .progress {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.1rem;
      margin-bottom: 1.75rem;
    }
    .progress-count {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      font-variant-numeric: tabular-nums;
    }
    .progress-count .of { color: var(--label-2); font-weight: 600; }
    .progress-note { margin-top: 0.1rem; font-size: 0.88rem; color: var(--label-2); }
    .progress-plain { font-weight: 600; }
    .ring { position: relative; width: 3.4rem; height: 3.4rem; flex-shrink: 0; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring-track { stroke: var(--fill-strong); }
    .ring-value { stroke: var(--accent); transition: stroke-dashoffset 600ms var(--ease-out), stroke 300ms ease; }
    .ring.full .ring-value { stroke: var(--green); }
    .ring.zero .ring-value { opacity: 0; }
    .ring-label {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 0.74rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    /* Okresy jako pasek informacyjny */
    .strips { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.25rem; }
    .strip {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.65rem 0.8rem 0.65rem 0.9rem;
      border-radius: 0.95rem;
      background: var(--pc-soft);
      color: var(--pc-text);
      font-size: 0.88rem;
      transition: transform 160ms var(--ease-out);
    }
    .strip:active { transform: scale(0.98); }
    .strip .chev { color: currentColor; opacity: 0.6; }
    .strip-text { flex: 1; min-width: 0; }
    .strip-note { display: block; margin-top: 0.1rem; opacity: 0.85; }
    .dot-pc { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--pc); flex-shrink: 0; }

    /* Pusty stan */
    .empty { padding: 2.25rem 1.5rem; text-align: center; }
    .empty h2 { font-size: 1.18rem; font-weight: 700; }
    .empty p { max-width: 19rem; margin: 0.4rem auto 1.25rem; color: var(--label-2); font-size: 0.94rem; line-height: 1.4; }

    /* ============================================================
       Przyciski i kontrolki
       ============================================================ */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      min-height: 2.75rem;
      padding: 0 1.25rem;
      border-radius: 999px;
      font-weight: 600;
      transition: transform 160ms var(--ease-out);
    }
    .btn:active { transform: scale(0.96); }
    .btn-sm { min-height: 2.25rem; padding: 0 0.95rem; font-size: 0.88rem; }
    .btn-block { width: 100%; }
    .btn-filled { background: var(--accent); color: #FFFFFF; }
    .btn-tinted { background: var(--accent-soft); color: var(--accent-text); }
    .btn-gray { background: var(--fill); color: var(--label); }
    .btn-danger { background: var(--red); color: #FFFFFF; }

    .icon-btn {
      flex-shrink: 0;
      width: 2.5rem;
      height: 2.5rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--accent-text);
    }
    .icon-btn:active { background: var(--fill); }
    .icon-btn.sm { width: 2.2rem; height: 2.2rem; color: var(--label-2); }
    .icon-btn.sm .ic { width: 1rem; height: 1rem; }
    .icon-btn.del span {
      width: 1.45rem;
      height: 1.45rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--red);
      color: #FFFFFF;
    }
    .icon-btn.del .ic { width: 0.9rem; height: 0.9rem; stroke-width: 3; }

    .switch {
      position: relative;
      flex-shrink: 0;
      width: 3.1rem;
      height: 1.9rem;
      border-radius: 999px;
      background: var(--fill-strong);
      transition: background-color 220ms ease;
    }
    .switch::before { content: ""; position: absolute; inset: -0.5rem; }
    .switch::after {
      content: "";
      position: absolute;
      top: 0.12rem;
      left: 0.12rem;
      width: 1.66rem;
      height: 1.66rem;
      border-radius: 50%;
      background: #FFFFFF;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 1px 1px rgba(0, 0, 0, 0.16);
      transition: transform 280ms var(--ease-drawer);
    }
    .switch[aria-checked="true"] { background: var(--green); }
    .switch[aria-checked="true"]::after { transform: translateX(1.2rem); }

    .seg {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-columns: repeat(var(--n), 1fr);
      padding: 0.125rem;
      border-radius: 0.6rem;
      background: var(--fill);
    }
    .seg-thumb {
      position: absolute;
      z-index: -1;
      top: 0.125rem;
      bottom: 0.125rem;
      left: 0.125rem;
      width: calc((100% - 0.25rem) / var(--n));
      border-radius: 0.5rem;
      background: var(--seg-thumb);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 0 0 0.5px rgba(0, 0, 0, 0.04);
      transform: translateX(calc(100% * var(--i)));
      transition: transform 300ms var(--ease-drawer);
    }
    .seg button {
      min-height: 2rem;
      padding: 0.3rem 0.4rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      text-align: center;
      white-space: nowrap;
    }
    .seg button[aria-pressed="true"] { font-weight: 600; }
    .seg:has(button:disabled) { opacity: 0.45; }
    .seg button:disabled { opacity: 1; }
    .seg-wrap { margin-bottom: 1rem; }

    .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.35rem; }
    .times { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.35rem; }
    .day-chip {
      height: 2.6rem;
      border-radius: 0.7rem;
      background: var(--fill);
      font-size: 0.88rem;
      font-weight: 600;
      text-align: center;
      transition: background-color 160ms ease, color 160ms ease, transform 160ms var(--ease-out);
    }
    .day-chip:active { transform: scale(0.94); }
    .day-chip[aria-pressed="true"] { background: var(--accent); color: #FFFFFF; }

    /* Pola formularzy w kartach */
    .field { padding: 0 1rem; }
    .field + .field { border-top: 0.5px solid var(--separator); }
    .field-stack { display: flex; flex-direction: column; gap: 0.6rem; padding: 0.75rem 1rem; }
    .field-label { font-size: 0.8rem; color: var(--label-2); }
    .input {
      width: 100%;
      min-height: 2.85rem;
      padding: 0.6rem 0;
      border: 0;
      background: transparent;
    }
    .input::placeholder { color: var(--label-3); }
    .input-time, .select {
      flex-shrink: 0;
      min-height: 2.25rem;
      padding: 0.35rem 0.7rem;
      border: 0;
      border-radius: 0.55rem;
      background: var(--fill);
      color: var(--label);
      font-variant-numeric: tabular-nums;
      -webkit-appearance: none;
      appearance: none;
    }
    .input-time { min-width: 5.6rem; text-align: center; }
    .input-time::-webkit-date-and-time-value { text-align: center; }
    .select { max-width: 13rem; padding-right: 0.8rem; text-overflow: ellipsis; }
    .input-time:focus-visible, .select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    .alert {
      margin-bottom: 1rem;
      padding: 0.7rem 0.9rem;
      border-radius: 0.8rem;
      background: var(--red-soft);
      color: var(--red-text);
      font-size: 0.88rem;
      font-weight: 500;
    }
    .notice {
      margin-bottom: 1rem;
      padding: 0.65rem 0.9rem;
      border-radius: 0.8rem;
      background: var(--fill);
      color: var(--label-2);
      font-size: 0.88rem;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 1.25rem; }
    .chip {
      min-height: 2.25rem;
      padding: 0 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      border-radius: 999px;
      background: var(--surface);
      font-size: 0.88rem;
      font-weight: 500;
      transition: transform 160ms var(--ease-out);
    }
    .chip:active { transform: scale(0.95); }
    .chips-label { margin: 0 0.25rem 0.5rem; font-size: 0.8rem; color: var(--label-2); }

    .swatches { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .swatch {
      width: 2.75rem;
      height: 2.75rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
    }
    .swatch span {
      width: 1.9rem;
      height: 1.9rem;
      border-radius: 50%;
      background: var(--pc);
      transition: transform 180ms var(--ease-out);
    }
    .swatch[aria-checked="true"] { box-shadow: inset 0 0 0 2.5px var(--pc); }
    .swatch[aria-checked="true"] span { transform: scale(0.74); }

    /* ============================================================
       Kalendarz
       ============================================================ */
    .cal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0.5rem 0.35rem 1rem;
    }
    .cal-month { font-size: 1.06rem; font-weight: 600; }
    .cal-nav { display: flex; gap: 0.15rem; }
    .cal-nav button {
      width: 2.6rem;
      height: 2.6rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--accent-text);
    }
    .cal-nav button:active { background: var(--fill); }
    .cal-nav .ic { stroke-width: 2.4; }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      row-gap: 0.25rem;
      padding: 0 0.5rem 0.6rem;
    }
    .cal-dow {
      padding: 0.2rem 0 0.35rem;
      text-align: center;
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--label-2);
      text-transform: uppercase;
    }
    .cal-cell { position: relative; display: flex; justify-content: center; }
    .cal-cell.band { background: var(--pc-soft); }
    .cal-cell.band-start { border-top-left-radius: 999px; border-bottom-left-radius: 999px; }
    .cal-cell.band-end { border-top-right-radius: 999px; border-bottom-right-radius: 999px; }
    .cal-day {
      position: relative;
      width: min(2.6rem, 100%);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-variant-numeric: tabular-nums;
      transition: background-color 180ms ease, color 180ms ease;
    }
    .cal-day:active { transform: scale(0.92); }
    .cal-day.outside { color: var(--label-3); }
    .cal-day.is-today { color: var(--accent-text); font-weight: 700; }
    .cal-day.pick[aria-pressed="true"] { background: var(--label); color: var(--bg); font-weight: 600; }
    .cal-day.pick.is-today[aria-pressed="true"] { background: var(--accent); color: #FFFFFF; }
    .cal-day.sel { outline: 2px solid var(--label); outline-offset: 1px; }
    .cal-dots {
      position: absolute;
      bottom: 0.22rem;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 0.18rem;
    }
    .dot { display: inline-block; width: 0.3rem; height: 0.3rem; border-radius: 50%; background: var(--accent); }
    .dot.green { background: var(--green); }
    .cal-day.pick[aria-pressed="true"] .dot { background: currentColor; }

    .cal-day.lv-1 { background: var(--lvl-1); }
    .cal-day.lv-2 { background: var(--lvl-2); }
    .cal-day.lv-3 { background: var(--lvl-3); color: #FFFFFF; font-weight: 600; }

    .cal-day.st-done { background: var(--green); color: #FFFFFF; font-weight: 600; }
    .cal-day.st-missed { background: var(--red-soft); color: var(--red-text); }
    .cal-day.st-pending { box-shadow: inset 0 0 0 2px var(--accent); color: var(--accent-text); font-weight: 700; }
    .cal-day.st-off, .cal-day.st-future, .cal-day.st-before, .cal-day.st-paused { color: var(--label-3); }

    .cal-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 1rem;
      padding: 0 1rem 0.9rem;
      font-size: 0.75rem;
      color: var(--label-2);
    }
    .cal-legend span { display: inline-flex; align-items: center; gap: 0.35rem; }
    .legend-sw { width: 0.75rem; height: 0.75rem; border-radius: 50%; display: inline-block; }

    .cal-periods { border-top: 0.5px solid var(--separator); padding: 0.4rem 0 0.4rem; }
    .mini-title { padding: 0.4rem 1rem 0.2rem; font-size: 0.8rem; font-weight: 600; color: var(--label-2); }
    .mini-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      min-height: 2.6rem;
      padding: 0.3rem 1rem;
    }
    .mini-row:active { background: var(--fill); }
    .mini-name { flex: 1; min-width: 0; font-size: 0.94rem; }
    .mini-range { font-size: 0.8rem; color: var(--label-2); }

    /* Rok */
    .year { padding-bottom: 0.9rem; }
    .year-scroll {
      --cell: 0.78rem;
      overflow-x: auto;
      padding: 0.2rem 1rem 0.3rem;
      scrollbar-width: none;
    }
    .year-scroll::-webkit-scrollbar { display: none; }
    .year-months, .year-grid { gap: 0.2rem; }
    .year-months {
      display: grid;
      grid-template-columns: repeat(52, var(--cell));
      height: 1rem;
      margin-bottom: 0.25rem;
      font-size: 0.66rem;
      color: var(--label-2);
    }
    .year-months span { white-space: nowrap; overflow: visible; }
    .year-grid {
      display: grid;
      grid-template-rows: repeat(7, var(--cell));
      grid-auto-flow: column;
      grid-auto-columns: var(--cell);
    }
    .yc {
      display: inline-block;
      width: var(--cell, 0.78rem);
      height: var(--cell, 0.78rem);
      border-radius: 0.2rem;
      background: var(--lvl-0);
    }
    .yc.l1 { background: var(--lvl-1); }
    .yc.l2 { background: var(--lvl-2); }
    .yc.l3 { background: var(--lvl-3); }
    .yc.future { background: transparent; box-shadow: inset 0 0 0 1px var(--separator); }
    .yc.today { outline: 2px solid var(--accent); outline-offset: 1px; }
    .yc.sel { outline: 2px solid var(--label); outline-offset: 1px; }
    .year-foot {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.25rem;
      padding: 0.5rem 1rem 0;
      font-size: 0.75rem;
      color: var(--label-2);
    }
    .year-foot .yc { width: 0.7rem; height: 0.7rem; margin: 0 0.06rem; }

    /* Statystyki nawyku */
    .detail-meta { margin: -0.25rem 0.25rem 1rem; color: var(--label-2); font-size: 0.88rem; line-height: 1.4; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; margin-bottom: 1rem; }
    .stat { padding: 0.8rem 0.9rem; border-radius: 1rem; background: var(--surface); }
    .stat-label { font-size: 0.75rem; font-weight: 500; color: var(--label-2); }
    .stat-value {
      margin-top: 0.1rem;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      font-variant-numeric: tabular-nums;
    }
    .stat-sub { font-size: 0.72rem; color: var(--label-2); }
    .day-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.8rem 1rem;
      border-top: 0.5px solid var(--separator);
    }
    .dp-date { font-weight: 600; }
    .dp-status { margin-top: 0.1rem; font-size: 0.85rem; color: var(--label-2); }

    /* Planer */
    .plan-group + .plan-group { border-top: 0.5px solid var(--separator); }
    .plan-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.35rem 0.5rem 0 1rem;
    }
    .plan-head h3 { font-size: 0.8rem; font-weight: 600; color: var(--label-2); }
    .plan-group .list > li:first-child::before { display: none; }
    .plan-empty { padding: 0.9rem 1rem 0.2rem; color: var(--label-2); font-size: 0.94rem; }
    .time-tag {
      flex-shrink: 0;
      min-width: 2.9rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent-text);
      font-variant-numeric: tabular-nums;
    }
    .reorder { display: flex; flex-shrink: 0; margin-right: -0.5rem; }

    /* Ustawienia */
    .row .seg { flex: 0 0 auto; }
    .row .seg button { min-width: 3.1rem; }
    .settings-seg { padding: 0.65rem 1rem; }
    .app-foot { padding: 0.25rem 0 1rem; text-align: center; font-size: 0.75rem; color: var(--label-2); }

    /* ============================================================
       Dolny pasek kart (pływająca kapsuła)
       ============================================================ */
    .tabbar {
      position: fixed;
      z-index: 60;
      left: 0;
      right: 0;
      bottom: max(0.75rem, calc(var(--safe-bottom) - 0.4rem));
      display: flex;
      justify-content: center;
      padding: 0 1rem;
      pointer-events: none;
    }
    .tabbar-inner {
      pointer-events: auto;
      width: 100%;
      max-width: 26rem;
      height: var(--tabbar-h);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.15rem;
      padding: 0.3rem;
      border-radius: 999px;
      background: var(--glass);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      backdrop-filter: blur(24px) saturate(180%);
      box-shadow: var(--shadow-float), inset 0 0 0 0.5px var(--glass-edge);
    }
    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.12rem;
      border-radius: 999px;
      font-size: 0.62rem;
      font-weight: 600;
      transition: transform 160ms var(--ease-out), background-color 200ms ease, color 200ms ease;
    }
    .tab .ic { width: 1.45rem; height: 1.45rem; }
    .tab[aria-current="page"] { color: var(--accent-text); background: var(--fill); }
    .tab:active { transform: scale(0.93); }

    /* ============================================================
       Arkusze (sheets)
       ============================================================ */
    .sheet-layer {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .scrim {
      position: absolute;
      inset: 0;
      background: var(--scrim);
      animation: fade-in 320ms ease backwards;
    }
    .sheet {
      position: relative;
      width: 100%;
      max-width: var(--content-w);
      max-height: calc(100dvh - var(--safe-top) - 0.75rem);
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border-radius: 1.6rem 1.6rem 0 0;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.18);
      animation: sheet-in 480ms var(--ease-drawer) backwards;
    }
    .closing .scrim { animation: fade-out 260ms ease forwards; }
    .closing .sheet { animation: sheet-out 280ms var(--ease-drawer) forwards; }
    .sheet-head {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.5rem;
      padding: 1.15rem 1rem 0.65rem;
      touch-action: none;
    }
    .grabber {
      position: absolute;
      top: 0.4rem;
      left: 50%;
      width: 2.3rem;
      height: 0.3rem;
      margin-left: -1.15rem;
      border-radius: 999px;
      background: var(--fill-strong);
    }
    .sheet-title {
      max-width: 13rem;
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sheet-btn {
      justify-self: start;
      min-height: 2.5rem;
      padding: 0 0.95rem;
      border-radius: 999px;
      background: var(--fill);
      font-size: 0.94rem;
      font-weight: 500;
      transition: transform 160ms var(--ease-out);
    }
    .sheet-btn:active { transform: scale(0.95); }
    .sheet-btn.primary { justify-self: end; background: var(--accent); color: #FFFFFF; font-weight: 600; }
    .sheet-body {
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 0.5rem 1rem calc(1.5rem + var(--safe-bottom));
    }
    .sheet-body .card, .sheet-body .stats { margin-bottom: 1.25rem; }
    .sheet-sub { margin: -0.25rem 0.25rem 1rem; font-size: 0.88rem; color: var(--label-2); }

    .alert-sheet .sheet-body { padding-top: 1.75rem; text-align: center; }
    .alert-sheet h2 { font-size: 1.18rem; font-weight: 700; }
    .alert-sheet p { max-width: 22rem; margin: 0.5rem auto 1.5rem; color: var(--label-2); line-height: 1.4; }
    .alert-actions { display: flex; flex-direction: column; gap: 0.6rem; }

    @media (min-width: 44rem) {
      .sheet-layer { align-items: center; padding: 1.5rem; }
      .sheet {
        max-height: min(85dvh, 48rem);
        border-radius: 1.6rem;
        animation-name: dialog-in;
        animation-duration: 260ms;
        animation-timing-function: var(--ease-out);
      }
      .closing .sheet { animation: dialog-out 180ms ease forwards; }
      .grabber { display: none; }
      .sheet-body { padding-bottom: 1.5rem; }
    }

    @keyframes fade-in { from { opacity: 0; } }
    @keyframes fade-out { to { opacity: 0; } }
    @keyframes sheet-in { from { transform: translateY(100%); } }
    @keyframes sheet-out { from { transform: translateY(0); } to { transform: translateY(100%); } }
    @keyframes dialog-in { from { opacity: 0; transform: scale(0.96); } }
    @keyframes dialog-out { to { opacity: 0; transform: scale(0.97); } }

    /* Menu */
    .menu-layer { position: fixed; inset: 0; z-index: 90; }
    .menu-dismiss { position: absolute; inset: 0; }
    .menu {
      position: absolute;
      top: calc(var(--safe-top) + 3.35rem);
      right: max(1rem, calc((100vw - var(--content-w)) / 2 + 0.75rem));
      min-width: 13rem;
      overflow: hidden;
      border-radius: 1rem;
      background: var(--glass);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      backdrop-filter: blur(30px) saturate(180%);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18), inset 0 0 0 0.5px var(--glass-edge);
      transform-origin: top right;
      animation: menu-in 220ms var(--ease-out) backwards;
    }
    .menu button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.8rem 1rem;
    }
    .menu button + button { border-top: 0.5px solid var(--separator); }
    .menu button:active { background: var(--fill); }
    @keyframes menu-in { from { opacity: 0; transform: scale(0.9); } }

    /* Toast */
    .toast {
      position: fixed;
      z-index: 150;
      left: 50%;
      bottom: calc(var(--tabbar-h) + max(0.75rem, calc(var(--safe-bottom) - 0.4rem)) + 0.9rem);
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0.9rem;
      width: max-content;
      max-width: min(26rem, calc(100vw - 2rem));
      padding: 0.7rem 1.1rem;
      border-radius: 999px;
      background: var(--toast-bg);
      color: #FFFFFF;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: var(--shadow-float);
      animation: toast-in 320ms var(--ease-out) backwards;
    }
    .toast.has-action { padding-right: 0.45rem; }
    .toast.closing { animation: toast-out 200ms ease forwards; }
    .toast-action {
      flex-shrink: 0;
      min-height: 2.1rem;
      padding: 0 0.85rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      color: #70B7FF;
      font-weight: 600;
    }
    @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 0.75rem); } }
    @keyframes toast-out { to { opacity: 0; transform: translate(-50%, 0.4rem); } }

    /* ============================================================
       Preferencje systemowe
       ============================================================ */
    @media (prefers-reduced-motion: reduce) {
      .sheet, .menu { animation: fade-in 200ms ease backwards; }
      .closing .sheet { animation: fade-out 160ms ease forwards; }
      .toast { animation: fade-in 200ms ease backwards; }
      .toast.closing { animation: fade-out 160ms ease forwards; }
      .seg-thumb, .switch::after, .ring-value, .topbar-title { transition: none; }
      .check .ic { transform: none; }
      .check:active .check-ring, .btn:active, .nav-btn:active, .tab:active, .chip:active,
      .day-chip:active, .strip:active, .sheet-btn:active, .cal-day:active { transform: none; }
    }
    @media (prefers-reduced-transparency: reduce) {
      .topbar::before, .tabbar-inner, .nav-btn, .menu {
        background: var(--surface);
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
    }
    @media (prefers-contrast: more) {
      :root { --separator: rgba(60, 60, 67, 0.45); --label-2: #3A3A3C; }
      .card, .stat { box-shadow: inset 0 0 0 1px var(--separator); }
    }
  
    /* ============================================================
       Forma — dodatki do wspólnego systemu (tokeny Rutyny 1.0.1)
       ============================================================ */
    :root {
      --orange: #FF9500;
      --orange-text: #A35200;
      --orange-soft: rgba(255, 149, 0, 0.16);
      --green-soft: rgba(52, 199, 89, 0.14);
    }
    html[data-theme="dark"] {
      --orange: #FF9F0A;
      --orange-text: #FFB340;
      --orange-soft: rgba(255, 159, 10, 0.2);
      --green-soft: rgba(48, 209, 88, 0.18);
    }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) {
        --orange: #FF9F0A;
        --orange-text: #FFB340;
        --orange-soft: rgba(255, 159, 10, 0.2);
        --green-soft: rgba(48, 209, 88, 0.18);
      }
    }

    .nav-btn.back { padding: 0 0.9rem 0 0.55rem; gap: 0.1rem; }
    .nav-btn.back .ic { width: 1.15rem; height: 1.15rem; }
    .nav-btn.prominent { background: var(--accent); color: #FFFFFF; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12); }
    html.session .topbar::before { opacity: 1; }
    html.session .topbar-title { opacity: 1; transform: none; }

    .mt { margin-top: 1rem; }
    .muted-note { color: var(--label-2); font-size: 0.88rem; line-height: 1.4; }
    .text-btn { color: var(--accent-text); font-weight: 500; padding: 0.4rem 0.25rem; margin: -0.4rem -0.25rem; }

    /* Tydzień */
    .week-card { padding: 0.35rem 0.5rem 0.7rem; margin-bottom: 1.5rem; }
    .week-head { display: flex; align-items: center; justify-content: space-between; padding: 0.15rem 0 0.35rem 0.6rem; }
    .week-title { font-weight: 600; }
    .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.15rem; }
    .wd { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; padding: 0.3rem 0; border-radius: 0.9rem; }
    .wd-dow { font-size: 0.66rem; font-weight: 600; color: var(--label-2); text-transform: uppercase; }
    .wd-num {
      width: min(2.3rem, 100%);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-variant-numeric: tabular-nums;
      transition: background-color 180ms ease, color 180ms ease;
    }
    .wd:active .wd-num { transform: scale(0.92); }
    .wd.is-today .wd-num { color: var(--accent-text); font-weight: 700; }
    .wd[aria-pressed="true"] .wd-num { background: var(--label); color: var(--bg); font-weight: 600; }
    .wd.is-today[aria-pressed="true"] .wd-num { background: var(--accent); color: #FFFFFF; }
    .wd-dots { display: flex; gap: 0.18rem; height: 0.32rem; }
    .dot.ring { background: transparent; box-shadow: inset 0 0 0 1.5px var(--orange); }
    .dot.purple { background: #AF52DE; }

    /* Karty planu i treningu */
    .plan-card { padding: 1rem 1rem 1.05rem; }
    .plan-card + .plan-card, .card + .plan-card, .plan-card + .card { margin-top: 1rem; }
    .kicker { font-size: 0.78rem; font-weight: 600; color: var(--label-2); margin-bottom: 0.2rem; }
    .kicker.live { color: var(--green-text); }
    .plan-card h3 { font-size: 1.12rem; font-weight: 700; letter-spacing: -0.01em; }
    .plan-card p { margin: 0.3rem 0 0.9rem; color: var(--label-2); font-size: 0.88rem; line-height: 1.4; }
    .btn-row { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .btn-row .btn { flex: 1 1 8rem; }

    .stats.two { grid-template-columns: repeat(2, 1fr); }
    .stat-value .unit { font-size: 0.8rem; font-weight: 600; color: var(--label-2); margin-left: 0.15rem; }
    .delta-up { color: var(--green-text); }
    .delta-down { color: var(--red-text); }

    /* Sesja treningowa */
    .session-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.9rem 0.6rem 0.9rem 1.1rem; margin-bottom: 1rem; }
    .session-clock { font-size: 1.9rem; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .session-meta { margin-top: 0.15rem; color: var(--label-2); font-size: 0.85rem; }
    .wex { margin-bottom: 1rem; }
    .wex-head { display: flex; align-items: flex-start; gap: 0.25rem; padding: 0.8rem 0.4rem 0.45rem 1rem; }
    .wex-title { flex: 1; min-width: 0; text-align: left; }
    .wex-name { display: block; font-weight: 600; line-height: 1.25; color: var(--accent-text); }
    .wex-skipped { padding: 0 1rem 0.9rem; color: var(--label-2); font-size: 0.88rem; }
    .set-grid {
      display: grid;
      grid-template-columns: 2.6rem minmax(0, 1fr) minmax(0, 1fr) 2.6rem;
      gap: 0.5rem;
      align-items: center;
      padding: 0.28rem 0.75rem;
    }
    .set-grid .span-2 { grid-column: span 2; }
    .set-head { padding-top: 0; padding-bottom: 0.1rem; font-size: 0.7rem; font-weight: 600; color: var(--label-2); text-align: center; }
    .set-row { transition: background-color 220ms ease; }
    .set-row.is-done { background: var(--green-soft); }
    .set-badge {
      width: 2.4rem;
      height: 2.4rem;
      margin: 0 auto;
      display: grid;
      place-items: center;
      border-radius: 0.7rem;
      background: var(--fill);
      font-weight: 700;
      font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
    }
    .set-badge.warm { background: var(--orange-soft); color: var(--orange-text); }
    .set-input {
      width: 100%;
      min-width: 0;
      height: 2.6rem;
      padding: 0 0.4rem;
      border: 0;
      border-radius: 0.7rem;
      background: var(--fill);
      text-align: center;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      -webkit-appearance: none;
      appearance: none;
    }
    .set-input::placeholder { color: var(--label-3); font-weight: 500; }
    .set-input:focus { outline: 2px solid var(--accent); outline-offset: 0; background: var(--surface); }
    .set-row.is-done .set-input:not(:focus) { background: transparent; }
    .set-check {
      width: 2.6rem;
      height: 2.6rem;
      margin: 0 auto;
      display: grid;
      place-items: center;
      border-radius: 0.7rem;
      background: var(--fill);
      color: var(--label-3);
      transition: background-color 160ms ease, color 160ms ease, transform 140ms var(--ease-out);
    }
    .set-check .ic { width: 1.1rem; height: 1.1rem; stroke-width: 3; }
    .set-check[aria-checked="true"] { background: var(--green); color: #FFFFFF; }
    .set-check:active { transform: scale(0.9); }
    .wex-foot { display: flex; gap: 0.5rem; padding: 0.45rem 0.75rem 0.85rem; }
    .wex-foot .btn { flex: 1; }
    .wex-note { padding: 0 1rem 0.6rem; font-size: 0.85rem; color: var(--label-2); }

    /* Minutnik przerwy */
    .rest-bar {
      position: fixed;
      z-index: 70;
      left: 0;
      right: 0;
      bottom: max(0.75rem, calc(var(--safe-bottom) - 0.4rem));
      display: flex;
      justify-content: center;
      padding: 0 1rem;
      pointer-events: none;
    }
    .rest-inner {
      pointer-events: auto;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: 100%;
      max-width: 26rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem;
      border-radius: 999px;
      background: var(--glass);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      backdrop-filter: blur(24px) saturate(180%);
      box-shadow: var(--shadow-float), inset 0 0 0 0.5px var(--glass-edge);
      animation: rest-in 420ms var(--ease-drawer) backwards;
    }
    .rest-fill {
      position: absolute;
      inset: 0;
      z-index: -1;
      background: var(--accent-soft);
      transform-origin: left center;
      transition: transform 1s linear;
    }
    .rest-time { flex: 1; text-align: center; line-height: 1.05; }
    .rest-time strong { display: block; font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .rest-time span { font-size: 0.68rem; font-weight: 600; color: var(--label-2); }
    .rest-btn {
      flex-shrink: 0;
      min-width: 3.1rem;
      height: 2.6rem;
      padding: 0 0.7rem;
      border-radius: 999px;
      background: var(--fill);
      font-size: 0.85rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      transition: transform 140ms var(--ease-out);
    }
    .rest-btn:active { transform: scale(0.94); }
    .rest-btn.primary { background: var(--accent); color: #FFFFFF; }
    @keyframes rest-in { from { transform: translateY(150%); } }

    /* Kapsuła trwającego treningu */
    .live-pill {
      position: fixed;
      z-index: 61;
      left: 0;
      right: 0;
      bottom: calc(max(0.75rem, calc(var(--safe-bottom) - 0.4rem)) + var(--tabbar-h) + 0.5rem);
      display: flex;
      justify-content: center;
      padding: 0 1rem;
      pointer-events: none;
    }
    .live-pill button {
      pointer-events: auto;
      width: 100%;
      max-width: 26rem;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.7rem 1rem;
      border-radius: 999px;
      background: var(--accent);
      color: #FFFFFF;
      font-weight: 600;
      box-shadow: var(--shadow-float);
      animation: rest-in 420ms var(--ease-drawer) backwards;
      transition: transform 160ms var(--ease-out);
    }
    .live-pill button:active { transform: scale(0.98); }
    .live-dot { width: 0.55rem; height: 0.55rem; flex-shrink: 0; border-radius: 50%; background: #FFFFFF; animation: live 2s ease-in-out infinite; }
    .live-pill .grow { flex: 1; min-width: 0; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .live-pill .tabnum { font-variant-numeric: tabular-nums; opacity: 0.9; }
    @keyframes live { 50% { opacity: 0.35; } }
    main.with-pill { padding-bottom: calc(var(--tabbar-h) + var(--safe-bottom) + 6.5rem); }
    main.session-main { padding-bottom: calc(var(--safe-bottom) + 7rem); }

    /* Wyszukiwanie i filtry */
    .search {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      padding: 0 0.8rem;
      border-radius: 0.75rem;
      background: var(--fill);
    }
    .search .ic { width: 1.1rem; height: 1.1rem; color: var(--label-2); }
    .search input { flex: 1; min-width: 0; min-height: 2.5rem; padding: 0.4rem 0; border: 0; background: transparent; }
    .search input::placeholder { color: var(--label-2); }
    .search input::-webkit-search-cancel-button { display: none; }
    .chip-scroll { display: flex; gap: 0.4rem; overflow-x: auto; margin: 0 -1rem 1rem; padding: 0 1rem; scrollbar-width: none; }
    .chip-scroll::-webkit-scrollbar { display: none; }
    .chip-scroll .chip { flex-shrink: 0; }
    .chip[aria-pressed="true"], .chip[aria-checked="true"] { background: var(--label); color: var(--bg); }
    .chips.wrap .chip { background: var(--fill); }
    .chips.wrap .chip[aria-pressed="true"] { background: var(--accent); color: #FFFFFF; }
    .pick-check {
      width: 1.5rem;
      height: 1.5rem;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 2px solid var(--label-3);
      transition: background-color 160ms ease, border-color 160ms ease;
    }
    .pick-check .ic { width: 0.85rem; height: 0.85rem; color: #FFFFFF; stroke-width: 3; opacity: 0; }
    .row-main[aria-pressed="true"] .pick-check { background: var(--accent); border-color: var(--accent); }
    .row-main[aria-pressed="true"] .pick-check .ic { opacity: 1; }
    .list-label { padding: 0.9rem 1rem 0.35rem; font-size: 0.8rem; font-weight: 600; color: var(--label-2); }
    .list-label:first-child { padding-top: 0.6rem; }

    /* Wykresy */
    .chart { padding: 0.5rem 0.75rem 0.85rem; }
    .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
    .chart-line { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
    .chart-area { fill: var(--accent-soft); stroke: none; }
    .chart-dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
    .chart-dot.last { fill: var(--accent); }
    .chart-text { font-size: 10px; fill: var(--label-2); font-family: inherit; }
    .chart-grid { stroke: var(--separator); stroke-width: 1; }
    .chart-empty { padding: 0.25rem 1rem 1rem; color: var(--label-2); font-size: 0.88rem; }
    .bars { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.5rem; align-items: end; height: 9rem; padding: 1.4rem 1rem 0; }
    .bar { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 0.25rem; }
    .bar-val { font-size: 0.64rem; font-weight: 600; color: var(--label-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .bar-fill { width: 100%; max-width: 2rem; min-height: 0.2rem; border-radius: 0.45rem 0.45rem 0.15rem 0.15rem; background: var(--accent); opacity: 0.5; }
    .bar.current .bar-fill { opacity: 1; }
    .bar-labels { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.5rem; padding: 0.35rem 1rem 0.9rem; font-size: 0.66rem; color: var(--label-2); text-align: center; }
    .bar-labels span { white-space: nowrap; overflow: hidden; }
    .meter { height: 0.45rem; border-radius: 999px; background: var(--fill); overflow: hidden; }
    .meter span { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
    .meter.green span { background: var(--green); }
    .muscle-row { padding: 0.65rem 1rem; }
    .muscle-top { display: flex; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.4rem; }
    .muscle-top span:last-child { color: var(--label-2); font-variant-numeric: tabular-nums; }
    .big-value { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .value-card { padding: 1rem 1.1rem 0.25rem; }
    .sets-line { font-size: 0.85rem; color: var(--label-2); font-variant-numeric: tabular-nums; line-height: 1.4; }
    .goal-row { padding: 0.75rem 1rem; }
    .goal-top { display: flex; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.45rem; }
    .goal-top span:last-child { color: var(--label-2); font-variant-numeric: tabular-nums; flex-shrink: 0; }

    /* Drobne kontrolki */
    .stepper { display: inline-flex; align-items: center; gap: 0.1rem; flex-shrink: 0; padding: 0.15rem; border-radius: 0.6rem; background: var(--fill); }
    .stepper button { width: 2.25rem; height: 2.05rem; display: grid; place-items: center; border-radius: 0.5rem; font-size: 1.15rem; font-weight: 600; }
    .stepper button:active { background: var(--fill-strong); }
    .stepper output { min-width: 2.2rem; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
    .input-inline {
      flex-shrink: 0;
      width: 6.5rem;
      min-height: 2.25rem;
      padding: 0.35rem 0.6rem;
      border: 0;
      border-radius: 0.55rem;
      background: var(--fill);
      text-align: right;
      font-variant-numeric: tabular-nums;
      -webkit-appearance: none;
      appearance: none;
    }
    .input-inline:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .ext-link { color: var(--accent-text); text-decoration: none; }

    @media (prefers-reduced-motion: reduce) {
      .rest-inner, .live-pill button { animation: fade-in 200ms ease backwards; }
      .live-dot { animation: none; }
      .rest-fill { transition: none; }
      .set-check:active, .rest-btn:active, .live-pill button:active, .wd:active .wd-num { transform: none; }
    }
    @media (prefers-reduced-transparency: reduce) {
      .rest-inner { background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; }
    }

    .toast span { min-width: 0; }
    .day-cards > .card + .card { margin-top: 1rem; }
    .row-main:has(.row-value) .row-text { flex: 0 0 auto; }
    .row-value { min-width: 0; margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search:focus-within { box-shadow: 0 0 0 2px var(--accent); }
    .search input:focus-visible { outline: none; }
  </style>
</head>

    const pad = (n) => String(n).padStart(2, '0');
    const toDateStr = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    function parseDate(s) {
      const [y, m, d] = String(s).split('-').map(Number);
      return new Date(y || 1970, (m || 1) - 1, d || 1, 12, 0, 0, 0);
    }
    function addDays(s, n) {
      const d = parseDate(s);
      d.setDate(d.getDate() + n);
      return toDateStr(d);
    }
    const dow = (s) => parseDate(s).getDay();
    function weekStart(s, ws) {
      const d = parseDate(s);
      d.setDate(d.getDate() - ((d.getDay() - ws + 7) % 7));
      return toDateStr(d);
    }
    const fmtLong = new Intl.DateTimeFormat('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' });

    const dayMonth = (s) => fmtDayMonth.format(parseDate(s));
    const shortDate = (s) => fmtShort.format(parseDate(s)).replace('.', '');
    function dateRange(a, b) {
      const A = parseDate(a);
      const B = parseDate(b);
      if (A.getMonth() === B.getMonth()) return `${A.getDate()}–${dayMonth(b)}`;
      return `${dayMonth(a)} – ${dayMonth(b)}`;
    }
    function relDay(s, today) {
      if (s === today) return 'dziś';
      if (s === addDays(today, -1)) return 'wczoraj';
      return dayMonth(s);
    }

    const WEEKDAYS = [

    const orderedDays = (ws) => (ws === 0 ? [WEEKDAYS[6], ...WEEKDAYS.slice(0, 6)] : WEEKDAYS);
    function daysLabel(days) {
      const d = days || [];
      if (!d.length) return 'Dowolny dzień';
      if (d.length === 7) return 'Codziennie';
      return WEEKDAYS.filter((w) => d.includes(w.d)).map((w) => w.s).join(', ');

      const a = Math.abs(n);
      if (a === 1) return one;

      const n = Number(s);

    let dbPromise = null;
    function openDB() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) {
          reject(new Error('Ta przeglądarka nie zapisuje danych lokalnie.'));
          return;
        }
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
          const db = req.result;
          STORES.forEach((s) => {
            if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' });
          });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => {
          dbPromise = null;
          reject(req.error);
        };
      });
      return dbPromise;
    }
    function dbTx(stores, fn) {
      return openDB().then(
        (db) =>
          new Promise((resolve, reject) => {
            const t = db.transaction(stores, 'readwrite');
            fn(t);
            t.oncomplete = () => resolve();
            t.onerror = () => reject(t.error);
            t.onabort = () => reject(t.error);
          })
      );
    }
    function dbGetAll(store) {
      return openDB().then(
        (db) =>
          new Promise((resolve, reject) => {
            if (!db.objectStoreNames.contains(store)) {
              resolve([]);
              return;
            }
            const req = db.transaction(store, 'readonly').objectStore(store).getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => reject(req.error);
          })
      );
    }
    const dbPut = (store, rec) => dbTx([store], (t) => t.objectStore(store).put(rec));
    const dbPutMany = (store, list) =>
      list.length ? dbTx([store], (t) => list.forEach((r) => t.objectStore(store).put(r))) : Promise.resolve();
    const dbDelete = (store, key) => dbTx([store], (t) => t.objectStore(store).delete(key));
    function persist(p) {
      p.catch(() => toast('Nie udało się zapisać zmian na urządzeniu.'));
      return p;
    }

    /* ============================================================
       Obliczenia
       ============================================================ */
    const n0 = (v) => Math.max(0, Number(v) || 0);
    function exMetrics(wex, includeWarm = incWarm()) {
      const mt = wex.measureType || W;
      const r = { volume: 0, sets: 0, warm: 0, reps: 0, time: 0, dist: 0, maxW: 0, e1rm: 0, bestReps: 0 };
      for (const s of wex.sets || []) {
        if (!s || !s.completed) continue;
        if (s.type === 'warmup') {
          r.warm++;
          if (!includeWarm) continue;
        } else r.sets++;
        const reps = n0(s.reps);
        const w = Number(s.weightKg) || 0;
        if (mt === W) {
          r.volume += Math.max(0, w) * reps;
          r.reps += reps;
          if (w > r.maxW) r.maxW = w;
          if (w > 0 && reps > 0 && reps <= 12) r.e1rm = Math.max(r.e1rm, reps === 1 ? w : w * (1 + reps / 30));
        } else if (mt === B) {
          r.reps += reps;
          r.bestReps = Math.max(r.bestReps, reps);
          if (w > r.maxW) r.maxW = w;
        } else if (mt === T) {
          r.time += n0(s.timeSec);
        } else {
          r.dist += n0(s.distanceKm);
          r.time += n0(s.timeSec);
        }
      }
      return r;
    }
    function workoutSummary(w, includeWarm = incWarm()) {
      const s = { volume: 0, sets: 0, warm: 0, reps: 0, exercises: 0, minutes: null };
      for (const ex of w.exercises || []) {
        if (ex.skipped) continue;
        const m = exMetrics(ex, includeWarm);
        if (m.sets || m.warm) s.exercises++;
        s.volume += m.volume;
        s.sets += m.sets;
        s.warm += m.warm;
        s.reps += m.reps;
      }
      if (w.startedAt && w.finishedAt) s.minutes = Math.max(1, Math.round((w.finishedAt - w.startedAt) / 60000));
      return s;
    }
    function exHistory(exId, { excludeId = null } = {}) {
      const list = completed()
        .filter((w) => w.id !== excludeId)
        .sort((a, b) => a.date.localeCompare(b.date) || (a.finishedAt || 0) - (b.finishedAt || 0));
      const entries = [];
      const best = { weight: 0, repsAtWeight: 0, e1rm: 0, reps: 0, time: 0, dist: 0 };
      for (const w of list) {
        for (const ex of w.exercises || []) {
          if (ex.exerciseId !== exId || ex.skipped) continue;
          const sets = (ex.sets || []).filter((s) => s.completed);
          if (!sets.length) continue;
          const m = exMetrics(ex, false);
          for (const s of sets) {
            if (s.type === 'warmup') continue;
            const wt = Number(s.weightKg) || 0;
            const rp = n0(s.reps);
            if (wt > best.weight || (wt === best.weight && rp > best.repsAtWeight)) {
              best.weight = wt;
              best.repsAtWeight = rp;
            }
            best.reps = Math.max(best.reps, rp);
            best.time = Math.max(best.time, n0(s.timeSec));
            best.dist = Math.max(best.dist, n0(s.distanceKm));
          }
          best.e1rm = Math.max(best.e1rm, m.e1rm);
          entries.push({ workoutId: w.id, workoutName: w.name, date: w.date, sets, metrics: m, measureType: ex.measureType || W });
        }
      }
      return { entries, last: entries[entries.length - 1] || null, best };
    }
    function setText(s, mt) {
      const w = Number(s.weightKg) || 0;
      if (mt === W) return `${fmtNum(toMass(w))}×${n0(s.reps)}`;
      if (mt === B) return w ? `${n0(s.reps)} (${w > 0 ? '+' : '−'}${fmtNum(toMass(Math.abs(w)))})` : `${n0(s.reps)}`;
      if (mt === T) return fmtDuration(n0(s.timeSec));
      return `${fmtNum(toDist(n0(s.distanceKm)), 2)} ${distUnit()}${s.timeSec ? ` / ${Math.round(n0(s.timeSec) / 60)} min` : ''}`;
    }
    const setsText = (sets, mt) => sets.filter((s) => s.type !== 'warmup').map((s) => setText(s, mt)).join(' · ');

    function inRange(w, from, to) {
      return w.date >= from && w.date <= to;
    }
    function muscleSets(from, to) {
      const out = {};
      for (const w of completed()) {
        if (!inRange(w, from, to)) continue;
        for (const ex of w.exercises || []) {
          if (ex.skipped) continue;
          const m = exMetrics(ex, false);
          if (!m.sets) continue;
          const muscles = (findEx(ex.exerciseId)?.primaryMuscles || ex.primaryMuscles || [IN]).filter(Boolean);
          for (const mu of muscles.length ? muscles : [IN]) out[mu] = (out[mu] || 0) + m.sets;
        }
      }
      return out;
    }
    function personalRecords(w) {
      const out = [];
      for (const ex of w.exercises || []) {
        if (ex.skipped) continue;
        const mt = ex.measureType || W;
        if (mt !== W) continue;
        const m = exMetrics(ex, false);
        if (!m.maxW) continue;
        const prev = exHistory(ex.exerciseId, { excludeId: w.id });
        const prevEntries = prev.entries.filter((e) => e.date <= w.date);
        if (!prevEntries.length) continue;
        if (m.maxW > prev.best.weight) out.push({ name: exName(ex), text: `${fmtMass(m.maxW)} — nowy najwyższy ciężar` });
        else if (m.e1rm > prev.best.e1rm + 0.01) out.push({ name: exName(ex), text: `szac. max ${fmtMass(m.e1rm)}` });
      }
      return out;
    }

    /* ============================================================
       Migracja katalogu i danych
       ============================================================ */
    function migrateCatalog(existing) {
      const changed = [];
      const byId = new Map(existing.map((e) => [e.id, e]));
      const claimed = new Set(existing.filter((e) => e.builtinKey).map((e) => e.builtinKey));
      for (const b of CATALOG) {
        const { aliases, ...base } = b;
        const cur = byId.get(b.id);
        if (cur) {
          if (!cur.customized) {
            const next = { ...cur, ...base, builtinKey: b.id };
            byId.set(b.id, next);
            changed.push(next);
          }
          claimed.add(b.id);
          continue;
        }
        if (claimed.has(b.id)) continue;
        const keys = new Set([norm(b.name), ...(aliases || []).map(norm)]);
        const match = [...byId.values()].find((e) => !e.builtinKey && !CATALOG.some((c) => c.id === e.id) && keys.has(norm(e.name)));
        if (match) {
          const next = {
            ...match,
            name: b.name,
            category: b.category,
            primaryMuscles: b.primaryMuscles,
            secondaryMuscles: b.secondaryMuscles,
            cues: match.cues || b.cues,
            builtinKey: b.id,
            renamedFrom: match.name !== b.name ? match.name : undefined
          };
          if (!next.renamedFrom) delete next.renamedFrom;
          byId.set(match.id, next);
          changed.push(next);
        } else {
          const rec = { ...base, builtinKey: b.id };
          byId.set(b.id, rec);
          changed.push(rec);
        }
        claimed.add(b.id);
      }
      return { exercises: [...byId.values()], changed };
    }

    /* ============================================================
       Morfowanie DOM (jak w Rutynie 1.0.1)
       ============================================================ */
    const keyOf = (n) => (n.nodeType === 1 ? n.getAttribute('data-key') : null);
    function patchChildren(parent, next) {
      const incoming = Array.from(next.childNodes);
      const keyed = new Map();
      for (const o of Array.from(parent.childNodes)) {
        const k = keyOf(o);
        if (k) keyed.set(k, o);
      }
      let i = 0;
      for (const n of incoming) {
        const cur = parent.childNodes[i] || null;
        const k = keyOf(n);
        if (k) {
          const match = keyed.get(k);
          if (match && match.nodeName === n.nodeName) {
            if (match !== cur) parent.insertBefore(match, cur);
            keyed.delete(k);
            patchNode(match, n);
            i++;
            continue;
          }
        } else if (cur && !keyOf(cur) && cur.nodeType === n.nodeType && cur.nodeName === n.nodeName) {
          patchNode(cur, n);
          i++;
          continue;
        } else if (cur && n.nodeType === 1) {
          const cls = n.getAttribute('class');
          let probe = cur.nextSibling;
          for (let step = 0; probe && step < 8; step++) {
            if (probe.nodeType === 1 && !keyOf(probe) && probe.nodeName === n.nodeName && probe.getAttribute('class') === cls) break;
            probe = probe.nextSibling;
          }
          if (probe && probe.nodeType === 1 && probe.nodeName === n.nodeName && probe.getAttribute('class') === cls) {
            let x = cur;
            while (x !== probe) {
              const nx = x.nextSibling;
              parent.removeChild(x);
              x = nx;
            }
            patchNode(probe, n);
            i++;
            continue;
          }
        }
        parent.insertBefore(n, cur);
        i++;
      }
      while (parent.childNodes.length > i) parent.removeChild(parent.lastChild);
    }
    function patchNode(a, b) {
      if (a.nodeType !== 1) {
        if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue;
        return;
      }
      const keepStyle = a.hasAttribute('data-keep-style');
      for (const attr of Array.from(a.attributes)) {
        if (keepStyle && attr.name === 'style') continue;
        if (!b.hasAttribute(attr.name)) a.removeAttribute(attr.name);
      }
      for (const attr of Array.from(b.attributes)) {
        if (keepStyle && attr.name === 'style') continue;
        if (a.getAttribute(attr.name) !== attr.value) a.setAttribute(attr.name, attr.value);
      }
      const tag = a.nodeName;
      if (tag === 'INPUT') {
        const v = b.getAttribute('value') ?? '';
        if (document.activeElement !== a && a.value !== v) a.value = v;
        return;
      }
      if (tag === 'TEXTAREA') {
        if (document.activeElement !== a && a.value !== b.textContent) a.value = b.textContent;
        return;
      }
      if (a.hasAttribute('data-live')) return;
      patchChildren(a, b);
      if (tag === 'SELECT') {
        const sel = b.querySelector('option[selected]');
        const v = sel ? sel.getAttribute('value') : '';
        if (document.activeElement !== a && a.value !== v) a.value = v;
      }
    }
    function morph(root, html) {
      const tpl = document.createElement('template');
      tpl.innerHTML = html;
      patchChildren(root, tpl.content);
    }
