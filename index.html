    function exerciseUsage(id) {
      return {
        workouts: state.workouts.filter((w) => (w.exercises || []).some((e) => e.exerciseId === id)).length,
        plans: state.plans.filter((p) => (p.exercises || []).some((e) => e.exerciseId === id)).length
      };
    }

    /* ---------- Otwieranie i zamykanie arkuszy ---------- */
    let lastOpener = null;
    function openSheet(type, data = {}) {
      if (!state.sheet && !lastOpener) lastOpener = document.activeElement;
      state.menu = null;
      state.sheet = { type, ...data, closing: false, focusPending: true };
      render();
    }
    function pushSheet(type, data = {}) {
      const prev = state.sheet;
      state.sheet = { type, ...data, prev, closing: false, focusPending: true };
      render();
      const body = appRoot.querySelector('.sheet-body');
      if (body) body.scrollTop = 0;
    }
    function popSheet() {
      const prev = state.sheet && state.sheet.prev;
      if (!prev) {
        closeSheet();
        return;
      }
      state.sheet = { ...prev, focusPending: true };
      render();
    }
    function restoreFocus() {
      if (lastOpener && lastOpener.isConnected) lastOpener.focus({ preventScroll: true });
      lastOpener = null;
    }
    function closeSheet(immediate = false) {
      const s = state.sheet;
      if (!s || s.closing) return;
      if (immediate) {
        state.sheet = null;
        render();
        restoreFocus();
        return;
      }
      s.closing = true;
      render();
      const wide = window.matchMedia('(min-width: 44rem)').matches;
      setTimeout(
        () => {
          if (state.sheet === s) {
            state.sheet = null;
            render();
            restoreFocus();
          }
        },
        reduceMotion.matches ? 170 : wide ? 190 : 290
      );
    }
    const sheetDirty = () => Boolean(state.sheet && state.sheet.form && state.sheet.form.dirty);

    let drag = null;
    const rubber = (x) => (x * 0.55 * 300) / (300 + 0.55 * x);
    document.addEventListener('pointerdown', (e) => {
      const handle = e.target.closest('[data-drag-handle]');
      if (!handle || e.target.closest('button') || window.matchMedia('(min-width: 44rem)').matches) return;
      const sheet = handle.closest('.sheet');
      const scrim = sheet.parentElement.querySelector('.scrim');
      drag = { sheet, scrim, id: e.pointerId, startY: e.clientY, y: 0, pts: [{ y: e.clientY, t: e.timeStamp }] };
      handle.setPointerCapture(e.pointerId);
      sheet.style.transition = 'none';
      scrim.style.transition = 'none';
    });
    document.addEventListener('pointermove', (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      let dy = e.clientY - drag.startY;
      if (dy < 0) dy = -rubber(-dy);
      drag.y = dy;
      drag.sheet.style.transform = `translateY(${dy}px)`;
      drag.scrim.style.opacity = String(Math.max(0, 1 - Math.max(0, dy) / (drag.sheet.offsetHeight || 1)));
      drag.pts.push({ y: e.clientY, t: e.timeStamp });
      if (drag.pts.length > 6) drag.pts.shift();
    });
    function endDrag(e) {
      if (!drag || e.pointerId !== drag.id) return;
      const { sheet, scrim, pts, y } = drag;
      drag = null;
      const a = pts[0];
      const b = pts[pts.length - 1];
      const v = b.t > a.t ? (b.y - a.y) / (b.t - a.t) : 0;
      const h = sheet.offsetHeight || 1;
      if (!sheetDirty() && (y > h * 0.3 || (v > 0.5 && y > 8))) {
        const dur = Math.max(140, Math.min(320, (h - y) / Math.max(v, 1.2)));
        sheet.style.transition = `transform ${dur}ms cubic-bezier(0.2, 0.8, 0.3, 1)`;
        sheet.style.transform = 'translateY(100%)';
        scrim.style.transition = `opacity ${dur}ms ease`;
        scrim.style.opacity = '0';
        setTimeout(() => closeSheet(true), dur);
      } else {
        sheet.style.transition = 'transform 420ms var(--ease-drawer)';
        sheet.style.transform = 'translateY(0)';
        scrim.style.transition = 'opacity 300ms ease';
        scrim.style.opacity = '1';
        setTimeout(() => {
          if (!sheet.isConnected) return;
          sheet.style.removeProperty('transform');
          sheet.style.removeProperty('transition');
          scrim.style.removeProperty('opacity');
          scrim.style.removeProperty('transition');
        }, 440);
      }
    }
    document.addEventListener('pointerup', endDrag);
    document.addEventListener('pointercancel', endDrag);

    /* ============================================================
       Zapis rekordów
       ============================================================ */
    function upsert(listName, store, rec) {
      const list = state[listName];
      const i = list.findIndex((x) => x.id === rec.id);
      if (i >= 0) list[i] = rec;
      else list.push(rec);
      return persist(dbPut(store, rec));
    }
    function removeWithUndo(listName, store, id, message, after) {
      const list = state[listName];
      const rec = list.find((x) => x.id === id);
      if (!rec) return;
      state[listName] = list.filter((x) => x.id !== id);
      persist(dbDelete(store, id));
      if (state.sheet) closeSheet();
      else render();
      if (after) after();
      toast(message, async () => {
        await upsert(listName, store, rec);
        render();
      });
    }

    /* ---------- Trening ---------- */
    let saveTimer = null;
    function saveActiveSoon() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveActiveNow, 350);
    }
    function saveActiveNow() {
      clearTimeout(saveTimer);
      const a = getActive();
      if (!a) return Promise.resolve();
      a.updatedAt = Date.now();
      return persist(dbPut('workouts', a));
    }

    function buildWex(exerciseId, opts = {}) {
      const e = findEx(exerciseId);
      const mt = e?.measureType || W;
      const hist = exHistory(exerciseId);
      const lastSets = (hist.last ? hist.last.sets : []).filter((s) => s.type !== 'warmup');
      const count = Math.max(1, Number(opts.targetSets) || Number(state.settings.defaultSets) || 3);
      const sets = [];
      for (let i = 0; i < count; i++) {
        const prev = lastSets[i] || lastSets[lastSets.length - 1];
        const tw = opts.targetWeightKg !== undefined && opts.targetWeightKg !== '' && opts.targetWeightKg !== null ? Number(opts.targetWeightKg) : null;
        sets.push({
          id: generateId('set'),
          type: 'working',
          weightKg: tw ?? prev?.weightKg ?? '',
          reps: prev?.reps ?? (mt === W || mt === B ? parseInt(opts.targetReps || state.settings.defaultReps, 10) || '' : ''),
          timeSec: prev?.timeSec ?? '',
          distanceKm: prev?.distanceKm ?? '',
          completed: false
        });
      }
      return {
        id: generateId('wex'),
        exerciseId,
        exerciseName: e?.name || opts.exerciseName || 'Ćwiczenie',
        primaryMuscles: e?.primaryMuscles || [IN],
        secondaryMuscles: e?.secondaryMuscles || [],
        measureType: mt,
        targetReps: opts.targetReps || (mt === W || mt === B ? state.settings.defaultReps : ''),
        restSeconds: Number(opts.restSeconds) || Number(state.settings.restDefault) || 90,
        note: opts.note || '',
        skipped: false,
        sets
      };
    }

    async function startWorkout(plan, date) {
      const existing = getActive();
      if (existing) {
        if (state.sheet) closeSheet(true);
        state.session = true;
        render();
        toast('Najpierw zakończ trwający trening');
        return;
      }
      const w = {
        id: generateId('workout'),
        planId: plan ? plan.id : null,
        name: plan ? plan.name : 'Trening',
        date: date || state.today,
        status: 'in_progress',
        startedAt: Date.now(),
        finishedAt: null,
        note: '',
        exercises: plan ? (plan.exercises || []).filter((pe) => findEx(pe.exerciseId)).map((pe) => buildWex(pe.exerciseId, pe)) : []
      };
      state.workouts.push(w);
      await persist(dbPut('workouts', w));
      if (state.sheet) closeSheet(true);
      state.session = true;
      state.editSets = {};
      render();
      window.scrollTo(0, 0);
      if (!plan) openPicker('add-session');
    }

    function findWex(id) {
      const a = getActive();
      return a ? a.exercises.find((x) => x.id === id) : null;
    }
    function findSet(wexId, setId) {
      const wex = findWex(wexId);
      return wex ? { wex, set: wex.sets.find((s) => s.id === setId) } : {};
    }

    async function finishWorkout(finishedAt = Date.now()) {
      const a = getActive();
      if (!a) return;
      const hasSets = a.exercises.some((ex) => !ex.skipped && ex.sets.some((s) => s.completed));
      if (!hasSets) {
        openSheet('finishEmpty');
        return;
      }
      a.status = 'completed';
      a.finishedAt = finishedAt;
      delete a.restEndsAt;
      delete a.restTotal;
      await persist(dbPut('workouts', a));
      state.session = false;
      state.editSets = {};
      const prs = personalRecords(a);
      state.sheet = null;
      openSheet('summary', { id: a.id, prs, fresh: true });
      window.scrollTo(0, 0);
    }

    function discardWorkout() {
      const a = getActive();
      if (!a) return;
      state.workouts = state.workouts.filter((w) => w.id !== a.id);
      persist(dbDelete('workouts', a.id));
      state.session = false;
      state.editSets = {};
      if (state.sheet) closeSheet(true);
      toast('Odrzucono trening', async () => {
        if (getActive()) return;
        await upsert('workouts', 'workouts', a);
        state.session = true;
        render();
      });
    }

    /* ---------- Minutnik przerwy ---------- */
    let audioCtx = null;
    function unlockAudio() {
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      } catch {
        audioCtx = null;
      }
    }
    function beep() {
      if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
      if (!audioCtx || state.settings.restSound === false) return;
      try {
        const t = audioCtx.currentTime;
        [0, 0.2].forEach((d, i) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = 'sine';
          o.frequency.value = i ? 1175 : 880;
          g.gain.setValueAtTime(0.0001, t + d);
          g.gain.exponentialRampToValueAtTime(0.3, t + d + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.17);
          o.connect(g);
          g.connect(audioCtx.destination);
          o.start(t + d);
          o.stop(t + d + 0.2);
        });
      } catch {
        /* brak dźwięku */
      }
    }
    function startRest(seconds) {
      const a = getActive();
      if (!a || state.settings.restTimer === false) return;
      a.restTotal = seconds;
      a.restEndsAt = Date.now() + seconds * 1000;
    }
    function endRest(withSignal) {
      const a = getActive();
      if (!a || !a.restEndsAt) return;
      delete a.restEndsAt;
      delete a.restTotal;
      saveActiveNow();
      render();
      if (withSignal) {
        beep();
        toast('Koniec przerwy');
      }
    }
    function tick() {
      const a = getActive();
      if (!a) return;
      const now = Date.now();
      const elapsed = fmtDuration((now - a.startedAt) / 1000);
      appRoot.querySelectorAll('[data-elapsed]').forEach((el) => {
        if (el.textContent !== elapsed) el.textContent = elapsed;
      });
      if (a.restEndsAt) {
        const left = Math.ceil((a.restEndsAt - now) / 1000);
        if (left <= 0) {
          endRest(document.visibilityState === 'visible');
          return;
        }
        const txt = fmtDuration(left);
        appRoot.querySelectorAll('[data-rest-left]').forEach((el) => {
          if (el.textContent !== txt) el.textContent = txt;
        });
        appRoot.querySelectorAll('[data-rest-pill]').forEach((el) => {
          const t = `przerwa ${txt} ·`;
          if (el.textContent !== t) el.textContent = t;
        });
        const ratio = Math.max(0, Math.min(1, (a.restEndsAt - now) / ((a.restTotal || 1) * 1000)));
        appRoot.querySelectorAll('[data-rest-fill]').forEach((el) => {
          el.style.transform = `scaleX(${ratio.toFixed(3)})`;
        });
      } else {
        appRoot.querySelectorAll('[data-rest-pill]').forEach((el) => {
          if (el.textContent) el.textContent = '';
        });
      }
    }

    async function mergeExercises(sourceId, targetId) {
      const src = findEx(sourceId);
      const dst = findEx(targetId);
      if (!src || !dst) return;
      const changedW = [];
      const backupW = [];
      for (const w of state.workouts) {
        if (!(w.exercises || []).some((e) => e.exerciseId === sourceId)) continue;
        backupW.push(JSON.parse(JSON.stringify(w)));
        w.exercises.forEach((e) => {
          if (e.exerciseId === sourceId) e.exerciseId = targetId;
        });
        changedW.push(w);
      }
      const changedP = [];
      const backupP = [];
      for (const p of state.plans) {
        if (!(p.exercises || []).some((e) => e.exerciseId === sourceId)) continue;
        backupP.push(JSON.parse(JSON.stringify(p)));
        p.exercises.forEach((e) => {
          if (e.exerciseId === sourceId) {
            e.exerciseId = targetId;
            e.exerciseName = dst.name;
          }
        });
        changedP.push(p);
      }
      const goalsBk = state.goals.filter((g) => g.exerciseId === sourceId).map((g) => ({ ...g }));
      state.goals.forEach((g) => {
        if (g.exerciseId === sourceId) g.exerciseId = targetId;
      });
      state.exercises = state.exercises.filter((e) => e.id !== sourceId);
      await persist(
        dbTx(['workouts', 'plans', 'exercises', 'goals'], (t) => {
          changedW.forEach((w) => t.objectStore('workouts').put(w));
          changedP.forEach((p) => t.objectStore('plans').put(p));
          state.goals.forEach((g) => t.objectStore('goals').put(g));
          t.objectStore('exercises').delete(sourceId);
        })
      );
      if (state.progress.exId === sourceId) state.progress.exId = targetId;
      closeSheet();
      toast(`Połączono z: ${dst.name}`, async () => {
        state.exercises.push(src);
        backupW.forEach((bw) => {
          const i = state.workouts.findIndex((w) => w.id === bw.id);
          if (i >= 0) state.workouts[i] = bw;
        });
        backupP.forEach((bp) => {
          const i = state.plans.findIndex((p) => p.id === bp.id);
          if (i >= 0) state.plans[i] = bp;
        });
        goalsBk.forEach((bg) => {
          const i = state.goals.findIndex((g) => g.id === bg.id);
          if (i >= 0) state.goals[i] = bg;
        });
        await persist(
          dbTx(['workouts', 'plans', 'exercises', 'goals'], (t) => {
            backupW.forEach((w) => t.objectStore('workouts').put(w));
            backupP.forEach((p) => t.objectStore('plans').put(p));
            goalsBk.forEach((g) => t.objectStore('goals').put(g));
            t.objectStore('exercises').put(src);
          })
        );
        render();
      });
    }

    async function deliverFile(name, mime, content) {
      const blob = new Blob([content], { type: mime });
      const touch = window.matchMedia('(pointer: coarse)').matches;
      if (touch && navigator.canShare && typeof File === 'function') {
        try {
          const file = new File([blob], name, { type: mime });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file] });
            return true;
          }
        } catch (err) {
          if (err && err.name === 'AbortError') return false;
        }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      return true;
    }
    function csvField(v) {
      const s = String(v ?? '').replace(/\r?\n/g, ' ');
      return /[;"]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    }
    const csv = (headers, rows) => '﻿' + [headers, ...rows].map((r) => r.map(csvField).join(';')).join('\r\n');
    const csvNum = (n) => (n === '' || n === null || n === undefined ? '' : String(Math.round(Number(n) * 100) / 100).replace('.', ','));
    function workoutsCsv() {
      const headers = ['Data', 'Trening', 'Ćwiczenie', 'Partie', 'Seria', 'Rodzaj serii', 'Ciężar (kg)', 'Powtórzenia', 'Czas (s)', 'Dystans (km)', 'Objętość (kg)'];
      const rows = [];
      for (const w of completed().sort((a, b) => a.date.localeCompare(b.date))) {
        for (const ex of w.exercises || []) {
          if (ex.skipped) continue;
          let n = 0;
          (ex.sets || [])
            .filter((s) => s.completed)
            .forEach((s) => {
              n++;
              const wt = Number(s.weightKg) || 0;
              rows.push([
                w.date,
                w.name,
                exName(ex),
                (findEx(ex.exerciseId)?.primaryMuscles || ex.primaryMuscles || []).join(', '),
                n,
                s.type === 'warmup' ? 'Rozgrzewka' : 'Robocza',
                wt ? csvNum(wt) : '',
                s.reps || '',
                s.timeSec || '',
                s.distanceKm ? csvNum(s.distanceKm) : '',
                (ex.measureType || W) === W ? csvNum(wt * n0(s.reps)) : ''
              ]);
            });
        }
      }
      return csv(headers, rows);
    }
    function bodyCsv() {
      const headers = ['Rodzaj', 'Data', 'Nazwa', 'Wartość', 'Jednostka', 'Czas (min)', 'Dystans (km)', 'Notatka'];
      const rows = [];
      [...state.measurements]
        .sort((a, b) => a.date.localeCompare(b.date))
        .forEach((m) => rows.push(['Pomiar', m.date, m.metricName || metricById(m.metricId).name, csvNum(m.value), m.unit, '', '', m.note || '']));
      [...state.activities]
        .sort((a, b) => a.date.localeCompare(b.date))
        .forEach((a) => rows.push(['Aktywność', a.date, a.type, '', '', a.durationMin || '', a.distanceKm ? csvNum(a.distanceKm) : '', a.note || '']));
      return csv(headers, rows);
    }
    function validateBackup(raw) {
      if (!raw || typeof raw !== 'object') throw new Error('To nie jest plik kopii.');
      if (raw.app !== 'Forma' || typeof raw.schemaVersion !== 'number') throw new Error('Ten plik nie jest kopią Formy.');
      if (!Array.isArray(raw.workouts) || !Array.isArray(raw.plans) || !Array.isArray(raw.exercises)) throw new Error('Kopia jest niekompletna.');
      const isObj = (x) => x && typeof x === 'object' && typeof x.id === 'string';
      return {
        exercises: raw.exercises.filter((e) => isObj(e) && typeof e.name === 'string'),
        plans: raw.plans.filter(isObj),
        workouts: raw.workouts.filter((w) => isObj(w) && /^\d{4}-\d{2}-\d{2}$/.test(w.date)),
        activities: (raw.activities || []).filter(isObj),
        stretchingRoutines: Array.isArray(raw.stretchingRoutines) ? raw.stretchingRoutines.filter(isObj) : [],
        measurements: (raw.measurements || []).filter(isObj),
        customMetrics: (raw.customMetrics || []).filter(isObj),
        goals: (raw.goals || []).filter(isObj),
        settings: { ...DEFAULT_SETTINGS, ...(raw.settings || {}), id: 'user_settings', catalogVersion: Number(raw.settings?.catalogVersion) || 1 }
      };
    }

      'set-done'(el) {
        unlockAudio();
        const { wex, set } = findSet(el.dataset.wex, el.dataset.setId);

          const idx = wex.sets.indexOf(set);
          const prev = wex.sets.slice(0, idx).reverse().find((s) => s.type === set.type) || wex.sets[idx - 1];
          for (const k of ['weightKg', 'reps', 'timeSec', 'distanceKm']) {
            if ((set[k] === '' || set[k] === null || set[k] === undefined) && prev && prev[k] !== '' && prev[k] !== undefined) set[k] = prev[k];
          }
          const next = wex.sets[idx + 1];
          if (next && !next.completed) {
            for (const k of ['weightKg', 'reps', 'timeSec', 'distanceKm']) {
              if (next[k] === '' || next[k] === null || next[k] === undefined) next[k] = set[k];
            }
          }
          startRest(Number(wex.restSeconds) || Number(state.settings.restDefault) || 90);
        }
        saveActiveNow();
        render();
      },
      'set-type'(el) {
        const { set } = findSet(el.dataset.wex, el.dataset.setId);
        if (!set) return;
        set.type = set.type === 'warmup' ? 'working' : 'warmup';
        saveActiveSoon();
        render();

      'set-add'(el) {
        const wex = findWex(el.dataset.wex);
        if (!wex) return;
        const type = el.dataset.type || 'working';
        const last = [...wex.sets].reverse().find((s) => s.type === type) || wex.sets[wex.sets.length - 1];
        const set = { id: generateId('set'), type, weightKg: last ? last.weightKg : '', reps: last ? last.reps : '', timeSec: last ? last.timeSec : '', distanceKm: last ? last.distanceKm : '', completed: false };
        if (type === 'warmup') {
          const firstWorking = wex.sets.findIndex((s) => s.type !== 'warmup');
          const at = firstWorking < 0 ? wex.sets.length : firstWorking;
          if (!last || last.type !== 'warmup') {
            set.weightKg = '';
            set.reps = '';
          }
          wex.sets.splice(at, 0, set);
        } else wex.sets.push(set);
        saveActiveSoon();

    document.addEventListener('click', async (e) => {
      const el = e.target.closest('[data-action]');
      if (!el || el.disabled || !appRoot.contains(el)) return;
      const fn = ACTIONS[el.dataset.action];
      if (!fn) return;
      e.preventDefault();
      try {
        await fn(el, e);
      } catch (err) {
        console.error(err);
        toast('Coś poszło nie tak. Spróbuj ponownie.');
      }
    });

    document.addEventListener('submit', (e) => {
      if (!e.target.matches('[data-form]')) return;
      e.preventDefault();
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      ACTIONS['sheet-save']();
    });

    document.addEventListener('input', (e) => {
      const el = e.target;
      if (!el.dataset) return;
      if ('set' in el.dataset) {
        const [wexId, setId] = el.dataset.set.split(':');
        const { wex, set } = findSet(wexId, setId);
        if (!set) return;
        const v = el.value;
        const f = el.dataset.f;
        if (f === 'w') {
          const n = parseNum(v);
          set.weightKg = n === null ? '' : Math.round(fromMass(n) * 100) / 100;
        } else if (f === 'r') {
          const n = parseInt(v, 10);
          set.reps = Number.isFinite(n) ? Math.max(0, n) : '';
        } else if (f === 't') {
          const n = parseInt(v, 10);
          set.timeSec = Number.isFinite(n) ? Math.max(0, n) : '';
        } else if (f === 'd') {
          const n = parseNum(v);
          set.distanceKm = n === null ? '' : Math.round(fromDist(Math.max(0, n)) * 1000) / 1000;
        } else if (f === 'm') {
          const n = parseInt(v, 10);
          set.timeSec = Number.isFinite(n) ? Math.max(0, n) * 60 : '';
        }
        if (wex) saveActiveSoon();
        return;
      }
      if ('catalogQ' in el.dataset) {
        state.catalog.q = el.value;
        render();
        return;
      }
      if ('pickerQ' in el.dataset && state.sheet) {
        state.sheet.q = el.value;
        render();
        return;
      }
      if ('item' in el.dataset && state.sheet && state.sheet.prev) {
        const it = state.sheet.prev.form.items[state.sheet.index];
        if (!it) return;
        if (el.dataset.item === 'targetReps') it.targetReps = el.value.trim();
        if (el.dataset.item === 'targetWeight') {
          const n = parseNum(el.value);
          it.targetWeightKg = n === null ? '' : Math.round(fromMass(n) * 100) / 100;
        }
        state.sheet.prev.form.dirty = true;
        return;
      }
      if ('setting' in el.dataset) {
        state.settings[el.dataset.setting] = el.value.trim() || DEFAULT_SETTINGS[el.dataset.setting];
        clearTimeout(window.__formaSettingTimer);
        window.__formaSettingTimer = setTimeout(() => persist(dbPut('settings', state.settings)), 400);
        return;
      }
      const key = el.dataset.field;
      const f = form();
      if (!key || !f) return;
      f[key] = el.value;
      f.dirty = true;
      if (f.error) f.error = null;
    });
    document.addEventListener('change', (e) => {
      const el = e.target;
      if (el.id === 'backup-input') return;
      if ('set' in (el.dataset || {})) {
        saveActiveNow();
        render();
        return;
      }
      if (el.dataset && el.dataset.field && form()) render();
    });
    document.addEventListener('focusin', (e) => {
      if (e.target.classList && e.target.classList.contains('set-input')) {
        setTimeout(() => {
          try {
            e.target.select();
          } catch {
            /* brak */
          }
        }, 0);
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('set-input')) {
        e.preventDefault();
        const inputs = [...appRoot.querySelectorAll('.set-input')];
        const next = inputs[inputs.indexOf(e.target) + 1];
        if (next) next.focus();
        else e.target.blur();
        return;
      }
      if (e.key !== 'Escape') return;
      if (state.menu) {
        state.menu = null;
        render();
      } else if (state.sheet) ACTIONS['sheet-cancel']();
      else if (state.session) ACTIONS['session-close']();
    });

    document.getElementById('backup-input').addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!file) return;
      try {
        const payload = validateBackup(JSON.parse(await file.text()));
        openSheet('importConfirm', { payload });
      } catch (err) {
        toast(err instanceof SyntaxError ? 'Nie da się odczytać tego pliku.' : err.message);
      }
    });

    async function loadAll() {
      try {
        const [exercises, plans, workouts, activities, routines, measurements, customMetrics, goals, settingsList] = await Promise.all(STORES.map(dbGetAll));
        const saved = settingsList.find((s) => s.id === 'user_settings');
        state.settings = { ...DEFAULT_SETTINGS, ...(saved || {}) };
        let exList = exercises;
        if ((Number(state.settings.catalogVersion) || 1) < CATALOG_VERSION || !exercises.length) {
          const r = migrateCatalog(exercises);
          exList = r.exercises;
          await dbPutMany('exercises', r.changed);
          state.settings.catalogVersion = CATALOG_VERSION;
          await dbPut('settings', state.settings);
        }
        state.exercises = exList;
        state.plans = plans;
        state.workouts = workouts.filter((w) => w.status !== 'abandoned');
        state.activities = activities;
        if (!routines.length && !saved) {
          await dbPutMany('stretching_routines', DEFAULT_ROUTINES);
          state.routines = [...DEFAULT_ROUTINES];
        } else {
          const tidy = [];
          state.routines = routines.map((r) => {
            const name = String(r.name || '').replace(/\s*\(\d+\s*min\)\s*$/i, '');
            if (name !== r.name) {
              const next = { ...r, name };
              tidy.push(next);
              return next;
            }
            return r;
          });
          dbPutMany('stretching_routines', tidy).catch(() => {});
        }
        state.measurements = measurements;
        state.customMetrics = customMetrics;
        state.goals = goals;
        state.today = toDateStr();
        state.day = state.today;
        state.ready = true;
        applyTheme();
        render();
        const a = getActive();
        if (a && Date.now() - (a.updatedAt || a.startedAt) > 6 * 3600 * 1000) openSheet('staleSession');
      } catch (err) {
        state.error = err && err.message ? err.message : 'Nieznany błąd bazy danych.';
        render();
      }
    }

    function refreshToday() {
      const t = toDateStr();
      if (t === state.today) return;
      const prev = state.today;
      state.today = t;
      if (state.day === prev) state.day = t;
      render();
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') {
        saveActiveNow();
        syncWakeLock();
        return;
      }
      refreshToday();
      tick();
      syncWakeLock();
    });
    window.addEventListener('pagehide', () => saveActiveNow());
    setInterval(refreshToday, 30000);

    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

    window.__forma = { state, migrateCatalog, CATALOG };
    loadAll();
  })();

  </script>
</body>
</html>
