    function lineChart(points, fmtY, label) {
      if (points.length < 2) return '';
      const Wd = 320;
      const H = 150;
      const L = 6;
      const R = 6;
      const T0 = 18;
      const Bt = 24;
      const ys = points.map((p) => p.value);
      let min = Math.min(...ys);
      let max = Math.max(...ys);
      if (min === max) {
        min -= 1;
        max += 1;
      }
      const padY = (max - min) * 0.12;
      min -= padY;
      max += padY;
      const x = (i) => L + (i * (Wd - L - R)) / (points.length - 1);
      const y = (v) => T0 + ((max - v) * (H - T0 - Bt)) / (max - min);
      const d = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
      const area = `${d} L${x(points.length - 1).toFixed(1)},${H - Bt} L${x(0).toFixed(1)},${H - Bt} Z`;
      const maxP = points.reduce((a, b) => (b.value > a.value ? b : a));
      const first = points[0];
      const last = points[points.length - 1];
      return `<div class="chart">
        <svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="${esc(label)}: od ${esc(fmtY(first.value))} (${shortDate(first.date)}) do ${esc(
        fmtY(last.value)
      )} (${shortDate(last.date)}), najwyżej ${esc(fmtY(maxP.value))}">
          <line class="chart-grid" x1="${L}" x2="${Wd - R}" y1="${H - Bt}" y2="${H - Bt}"/>
          <path class="chart-area" d="${area}"/>
          <path class="chart-line" d="${d}"/>
          ${points
            .map((p, i) => `<circle class="chart-dot ${i === points.length - 1 ? 'last' : ''}" cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="${points.length > 24 ? 1.8 : 3}"/>`)
            .join('')}
          <text class="chart-text" x="${x(points.indexOf(maxP)).toFixed(1)}" y="${(y(maxP.value) - 7).toFixed(1)}" text-anchor="middle">${esc(fmtY(maxP.value))}</text>
          <text class="chart-text" x="${L}" y="${H - 6}">${shortDate(first.date)}</text>
          <text class="chart-text" x="${Wd - R}" y="${H - 6}" text-anchor="end">${shortDate(last.date)}</text>
        </svg>
      </div>`;
    }

    /* ============================================================
       Render
       ============================================================ */
    function render() {
      if (!state.ready) {
        if (state.error) {
          appRoot.innerHTML = `<main style="padding-top:4rem"><section class="card empty"><h2>Nie udało się otworzyć danych</h2><p>${esc(state.error)}</p></section></main>`;
        }
        return;
      }
      const active = getActive();
      if (state.session && !active) state.session = false;
      const blocked = Boolean(state.sheet || state.menu);
      const inSession = state.session;
      const showPill = !inSession && active;
      const page = inSession ? 'session' : `${state.tab}-${state.sub[state.tab] || ''}`;
      const html = `
        ${renderTopbar(blocked)}
        <div class="page" data-key="page-${page}" ${blocked ? 'inert' : ''}>
          ${inSession ? '' : renderLargeTitle()}
          <main class="${inSession ? 'session-main' : showPill ? 'with-pill' : ''}">${inSession ? viewSession(active) : renderView()}</main>
        </div>
        ${inSession ? renderRestBar(active, blocked) : renderTabbar(blocked)}
        ${showPill ? renderLivePill(active, blocked) : ''}
        ${state.menu ? renderMenu() : ''}
        ${state.sheet ? renderSheet() : ''}
        <div class="toast-host" role="status" aria-live="polite" data-key="toast-host">${state.toast ? renderToast() : ''}</div>`;
      morph(appRoot, html);
      afterRender();
    }

    function afterRender() {
      const root = document.documentElement;
      root.classList.toggle('locked', Boolean(state.sheet));
      root.classList.toggle('session', state.session);
      if (state.sheet && state.sheet.focusPending) {
        state.sheet.focusPending = false;
        const target = appRoot.querySelector('[data-autofocus]') || appRoot.querySelector('#sheet-title');
        if (target) target.focus({ preventScroll: true });
      }
      if (state.menu && state.menuFocus) {
        state.menuFocus = false;
        const first = appRoot.querySelector('.menu [role="menuitem"]');
        if (first) first.focus({ preventScroll: true });
      }
      updateScrolled();
      tick();
      syncWakeLock();
    }

    function updateScrolled() {
      document.documentElement.classList.toggle('scrolled', window.scrollY > 36);
    }
    let scrollTick = false;
    window.addEventListener(
      'scroll',
      () => {
        if (scrollTick) return;
        scrollTick = true;
        requestAnimationFrame(() => {
          scrollTick = false;
          updateScrolled();
        });
      },
      { passive: true }
    );

    function renderTopbar(blocked) {
      let start = '';
      let title = '';
      let end = '';
      if (state.session) {
        const a = getActive();
        start = `<button type="button" class="nav-btn back" data-action="session-close" aria-label="Zwiń trening">${icon('chevD')}Zwiń</button>`;
        title = esc(a ? a.name : 'Trening');
        end = `<button type="button" class="nav-btn prominent" data-action="session-finish">Zakończ</button>`;
      } else if (state.tab === 'today') {
        title = 'Dzisiaj';
        end = navIcon('today-menu', 'plus', 'Dodaj', `aria-haspopup="menu" aria-expanded="${state.menu === 'today'}"`);
      } else if (state.tab === 'plans') {
        if (state.sub.plans === 'catalog') {
          start = `<button type="button" class="nav-btn back" data-action="sub-back">${icon('chevL')}Plany</button>`;
          title = 'Ćwiczenia';
          end = navIcon('new-exercise', 'plus', 'Nowe ćwiczenie');
        } else {
          title = 'Plany';
          end = navIcon('new-plan', 'plus', 'Nowy plan');
        }
      } else if (state.tab === 'progress') {
        title = 'Postępy';
        if (state.progress.seg === 'body') end = navIcon('new-measurement', 'plus', 'Dodaj pomiar');
      } else {
        title = 'Ustawienia';
      }
      return `<header class="topbar" data-key="topbar" ${blocked ? 'inert' : ''}>
        <div class="topbar-inner">
          <div class="topbar-side">${start}</div>
          <div class="topbar-title" ${state.session ? '' : 'aria-hidden="true"'}>${title}</div>
          <div class="topbar-side end">${end}</div>
        </div>
      </header>`;
    }

    function renderLargeTitle() {
      let h = '';
      let p = '';
      if (state.tab === 'today') {
        h = 'Dzisiaj';
        p = longDate(state.today);
      } else if (state.tab === 'plans') h = state.sub.plans === 'catalog' ? 'Ćwiczenia' : 'Plany';
      else if (state.tab === 'progress') h = 'Postępy';
      else h = 'Ustawienia';
      return `<div class="large-title"><h1>${h}</h1>${p ? `<p>${esc(p)}</p>` : ''}</div>`;
    }

    const TABS = [
      ['today', 'Dzisiaj', 'tabToday'],
      ['plans', 'Plany', 'tabPlans'],
      ['progress', 'Postępy', 'tabProgress'],
      ['settings', 'Ustawienia', 'tabSettings']
    ];
    function renderTabbar(blocked) {
      return `<nav class="tabbar" aria-label="Sekcje" data-key="tabbar" ${blocked ? 'inert' : ''}>
        <div class="tabbar-inner">${TABS.map(
          ([id, label, ic]) =>
            `<button type="button" class="tab" data-action="tab" data-tab="${id}" ${state.tab === id ? 'aria-current="page"' : ''}>${icon(ic)}<span>${label}</span></button>`
        ).join('')}</div>
      </nav>`;
    }

    function renderLivePill(a, blocked) {
      return `<div class="live-pill" data-key="live-pill" ${blocked ? 'inert' : ''}>
        <button type="button" data-action="session-open" aria-label="Wróć do treningu: ${esc(a.name)}">
          <span class="live-dot" aria-hidden="true"></span>
          <span class="grow">${esc(a.name)}</span>
          <span class="tabnum" data-live data-rest-pill>${a.restEndsAt ? '' : ''}</span>
          <span class="tabnum" data-live data-elapsed></span>
          ${icon('chevR')}
        </button>
      </div>`;
    }

    function renderView() {
      if (state.tab === 'today') return viewToday();
      if (state.tab === 'plans') return state.sub.plans === 'catalog' ? viewCatalog() : viewPlans();
      if (state.tab === 'progress') return viewProgress();
      return viewSettings();
    }

    /* ---------- Dzisiaj ---------- */
    function dayInfo(d) {
      const done = completed().filter((w) => w.date === d);
      const acts = state.activities.filter((a) => a.date === d);
      const planned = state.plans.filter((p) => !p.archived && (p.scheduledDays || []).includes(dow(d)));
      const routines = state.routines.filter((r) => (r.assignedDays || []).includes(dow(d)));
      return { done, acts, planned, routines };
    }
    const routineDone = (r, d) =>
      state.activities.find((a) => a.date === d && (a.routineId === r.id || (STRETCH_TYPES.includes(a.type) && a.note && norm(a.note).startsWith(norm(r.name)))));

    function viewToday() {
      const d = state.day;
      const today = state.today;
      const start = weekStart(d, ws());
      const days = [...Array(7)].map((_, i) => addDays(start, i));
      const active = getActive();
      const info = dayInfo(d);
      const pendingPlans = info.planned.filter((p) => !info.done.some((w) => w.planId === p.id) && !(active && active.planId === p.id && active.date === d));
      const isPast = d < today;

      const week = `<section class="card week-card" aria-label="Tydzień">
        <div class="week-head">
          <span class="week-title">${esc(dateRange(days[0], days[6]))}</span>
          <div class="cal-nav">
            <button type="button" data-action="week-shift" data-dir="-1" aria-label="Poprzedni tydzień">${icon('chevL')}</button>
            <button type="button" data-action="week-shift" data-dir="1" aria-label="Następny tydzień">${icon('chevR')}</button>
          </div>
        </div>
        <div class="week-grid">
          ${days
            .map((ds) => {
              const di = dayInfo(ds);
              const hasW = di.done.length > 0;
              const hasA = di.acts.some((a) => !STRETCH_TYPES.includes(a.type));
              const hasS = di.acts.some((a) => STRETCH_TYPES.includes(a.type));
              const plannedOpen = ds >= today && !hasW && di.planned.length > 0;
              const label = `${longDate(ds)}${hasW ? ', trening' : ''}${hasA ? ', aktywność' : ''}${hasS ? ', mobilność' : ''}${plannedOpen ? ', zaplanowany trening' : ''}`;
              return `<button type="button" class="wd ${ds === today ? 'is-today' : ''}" data-action="select-day" data-date="${ds}" aria-pressed="${ds === d}" aria-label="${esc(label)}" ${
                ds === today ? 'aria-current="date"' : ''
              }>
                <span class="wd-dow" aria-hidden="true">${WEEKDAYS.find((w) => w.d === dow(ds)).s}</span>
                <span class="wd-num" aria-hidden="true">${parseDate(ds).getDate()}</span>
                <span class="wd-dots" aria-hidden="true">${hasW ? '<i class="dot"></i>' : ''}${hasA ? '<i class="dot green"></i>' : ''}${hasS ? '<i class="dot purple"></i>' : ''}${
                plannedOpen ? '<i class="dot ring"></i>' : ''
              }</span>
              </button>`;
            })
            .join('')}
        </div>
      </section>`;

      const cards = [];
      if (active && active.date === d) {
        cards.push(`<section class="card plan-card" data-key="live-card">
          <div class="kicker live">Trwa</div>
          <h3>${esc(active.name)}</h3>
          <p>${pl(active.exercises.length, 'ćwiczenie', 'ćwiczenia', 'ćwiczeń')} · rozpoczęty o ${new Date(active.startedAt).toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' })}</p>
          <button type="button" class="btn btn-filled btn-block" data-action="session-open">Wróć do treningu</button>
        </section>`);
      }
      for (const w of info.done) {
        const s = workoutSummary(w);
        cards.push(`<section class="card" data-key="done-${esc(w.id)}"><ul class="list">${navRow(esc(w.name), 'open-summary', {
          sub: [s.minutes ? `${s.minutes} min` : '', pl(s.sets, 'seria', 'serie', 'serii'), s.volume ? fmtMass(s.volume, 0) : ''].filter(Boolean).join(' · '),
          attrs: `data-id="${esc(w.id)}"`
        })}</ul></section>`);
      }
      for (const p of pendingPlans) {
        cards.push(`<section class="card plan-card" data-key="plan-${esc(p.id)}">
          <div class="kicker">${isPast ? 'Był zaplanowany' : 'Zaplanowany'}</div>
          <h3>${esc(p.name)}</h3>
          <p>${(p.exercises || []).map((e) => esc(findEx(e.exerciseId)?.name || e.exerciseName)).join(' · ') || 'Plan bez ćwiczeń'}</p>
          <div class="btn-row">
            <button type="button" class="btn btn-filled" data-action="start-plan" data-id="${esc(p.id)}" data-date="${d}">${isPast ? 'Zapisz trening' : 'Rozpocznij'}</button>
            <button type="button" class="btn btn-gray" data-action="edit-plan" data-id="${esc(p.id)}">Plan</button>
          </div>
        </section>`);
      }
      if (!cards.length) {
        cards.push(`<section class="card plan-card" data-key="empty-day">
          <h3>${d === today ? 'Na dziś nic nie zaplanowano' : d < today ? 'Brak treningu' : 'Nic nie zaplanowano'}</h3>
          <div class="btn-row" style="margin-top:0.9rem">
            <button type="button" class="btn btn-filled" data-action="start-picker" data-date="${d}">${d <= today ? 'Rozpocznij trening' : 'Trening'}</button>
            <button type="button" class="btn btn-gray" data-action="new-activity" data-date="${d}">Aktywność</button>
          </div>
        </section>`);
      }

      const routineRows = info.routines.map((r) => {
        const doneAct = routineDone(r, d);
        return `<li data-key="r-${esc(r.id)}"><div class="row ${doneAct ? 'is-done' : ''}">
          <button type="button" class="check" role="checkbox" aria-checked="${Boolean(doneAct)}" data-action="routine-toggle" data-id="${esc(r.id)}" aria-label="${esc(r.name)}">
            <span class="check-ring">${icon('check')}</span></button>
          <button type="button" class="row-main" data-action="edit-routine" data-id="${esc(r.id)}">
            <span class="row-text"><span class="row-title">${esc(r.name)}</span><span class="row-meta">${r.durationMin || 10} min</span></span>${icon('chevR', 'chev')}
          </button>
        </div></li>`;
      });
      const actRows = info.acts
        .filter((a) => !info.routines.some((r) => routineDone(r, d) === a))
        .map((a) =>
          navRow(esc(a.type), 'edit-activity', {
            key: `a-${esc(a.id)}`,
            attrs: `data-id="${esc(a.id)}"`,
            sub: [a.durationMin ? `${a.durationMin} min` : '', a.distanceKm ? fmtDist(a.distanceKm) : '', a.note ? esc(a.note) : ''].filter(Boolean).join(' · ')
          })
        );

      const wkStart = weekStart(d, ws());
      const wkEnd = addDays(wkStart, 6);
      const wk = completed().filter((w) => inRange(w, wkStart, wkEnd));
      let sets = 0;
      let vol = 0;
      wk.forEach((w) => {
        const s = workoutSummary(w);
        sets += s.sets;
        vol += s.volume;
      });
      const wkActs = state.activities.filter((a) => a.date >= wkStart && a.date <= wkEnd).length;

      return `${week}
        <div class="section day-cards">${cards.join('')}</div>
        ${
          routineRows.length || actRows.length
            ? `<section class="section">
                <div class="section-head"><h2 class="section-title">Ruch i mobilność</h2>
                  <button type="button" class="section-action" data-action="new-activity" data-date="${d}">Dodaj</button></div>
                <ul class="card list ${routineRows.length ? 'with-check' : ''}">${routineRows.join('')}${actRows.join('')}</ul>
              </section>`
            : ''
        }
        <section class="section">
          <div class="section-head"><h2 class="section-title">${wkStart === weekStart(state.today, ws()) ? 'Ten tydzień' : 'Tydzień'}</h2></div>
          <div class="stats two">
            <div class="stat"><div class="stat-label">Treningi</div><div class="stat-value">${wk.length}</div></div>
            <div class="stat"><div class="stat-label">Serie robocze</div><div class="stat-value">${sets}</div></div>
            <div class="stat"><div class="stat-label">Objętość</div><div class="stat-value">${fmtNum(toMass(vol), 0)}<span class="unit">${massUnit()}</span></div></div>
            <div class="stat"><div class="stat-label">Aktywności</div><div class="stat-value">${wkActs}</div></div>
          </div>
        </section>`;
    }

    /* ---------- Sesja treningowa ---------- */
    function viewSession(a) {
      const s = workoutSummary(a);
      return `<section class="card session-head" data-key="session-head">
          <div>
            <div class="session-clock" data-live data-elapsed aria-label="Czas treningu"></div>
            <div class="session-meta">${a.date === state.today ? '' : `${esc(longDate(a.date))} · `}${pl(s.sets, 'seria', 'serie', 'serii')}${
        s.volume ? ` · ${fmtMass(s.volume, 0)}` : ''
      }</div>
          </div>
          <button type="button" class="icon-btn" data-action="session-meta" aria-label="Nazwa, data i notatka treningu">${icon('more')}</button>
        </section>
        ${a.exercises.map((wex, i) => wexCard(a, wex, i)).join('')}
        ${
          a.exercises.length
            ? ''
            : `<section class="card empty" data-key="session-empty"><h2>Pusty trening</h2><p>Dodaj pierwsze ćwiczenie, a serie z poprzedniego razu podpowiedzą się same.</p></section>`
        }
        <button type="button" class="btn btn-tinted btn-block" data-action="session-add-ex" data-key="session-add">${icon('plus')}Dodaj ćwiczenie</button>`;
    }

    function setColumns(mt) {
      if (mt === W) return ['Seria', massUnit(), 'Powt.'];
      if (mt === B) return ['Seria', `+${massUnit()}`, 'Powt.'];
      if (mt === T) return ['Seria', 'Czas (s)'];
      return ['Seria', distUnit(), 'Min'];
    }

    function wexCard(a, wex, idx) {
      const mt = wex.measureType || W;
      const hist = exHistory(wex.exerciseId, { excludeId: a.id });
      const last = hist.last;
      const editing = Boolean(state.editSets[wex.id]);
      const cols = setColumns(mt);
      const name = exName(wex);
      const meta = [
        wex.targetReps && (mt === W || mt === B) ? `Cel ${esc(String(wex.targetReps).replace('-', '–'))}` : '',
        last ? `Ostatnio ${esc(setsText(last.sets, mt))}` : 'Pierwszy raz'
      ]
        .filter(Boolean)
        .join(' · ');
      let working = 0;
      const rows = (wex.sets || [])
        .map((s, si) => {
          const warm = s.type === 'warmup';
          if (!warm) working++;
          const label = warm ? 'R' : String(working);
          const srLabel = warm ? 'rozgrzewkowa' : `${working}`;
          const fid = `${wex.id}:${s.id}`;
          let inputs;
          if (mt === W || mt === B) {
            inputs = `<input class="set-input" type="text" inputmode="${mt === B ? 'text' : 'decimal'}" autocomplete="off" data-set="${fid}" data-f="w"
                value="${esc(s.weightKg === '' || s.weightKg === null || s.weightKg === undefined ? '' : inputNum(toMass(s.weightKg), 2))}" placeholder="${mt === B ? '0' : '–'}" aria-label="${
              mt === B ? 'Obciążenie dodatkowe' : 'Ciężar'
            }, seria ${srLabel}" />
              <input class="set-input" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-set="${fid}" data-f="r" value="${esc(
                s.reps === '' || s.reps === null || s.reps === undefined ? '' : s.reps
              )}" placeholder="–" aria-label="Powtórzenia, seria ${srLabel}" />`;
          } else if (mt === T) {
            inputs = `<input class="set-input span-2" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-set="${fid}" data-f="t" value="${esc(
              s.timeSec ?? ''
            )}" placeholder="–" aria-label="Czas w sekundach, seria ${srLabel}" />`;
          } else {
            inputs = `<input class="set-input" type="text" inputmode="decimal" autocomplete="off" data-set="${fid}" data-f="d" value="${esc(
              s.distanceKm ? inputNum(toDist(s.distanceKm), 2) : ''
            )}" placeholder="–" aria-label="Dystans, seria ${srLabel}" />
              <input class="set-input" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-set="${fid}" data-f="m" value="${esc(
                s.timeSec ? Math.round(s.timeSec / 60) : ''
              )}" placeholder="–" aria-label="Minuty, seria ${srLabel}" />`;
          }
          const lead = editing
            ? `<button type="button" class="icon-btn del" data-action="set-remove" data-wex="${esc(wex.id)}" data-set-id="${esc(s.id)}" aria-label="Usuń serię ${srLabel}"><span>${icon('minus')}</span></button>`
            : `<button type="button" class="set-badge ${warm ? 'warm' : ''}" data-action="set-type" data-wex="${esc(wex.id)}" data-set-id="${esc(
                s.id
              )}" aria-label="Seria ${srLabel}. Zmień na ${warm ? 'roboczą' : 'rozgrzewkową'}">${label}</button>`;
          return `<div class="set-grid set-row ${s.completed ? 'is-done' : ''}" data-key="set-${esc(s.id)}">
            ${lead}
            ${inputs}
            <button type="button" class="set-check" role="checkbox" aria-checked="${Boolean(s.completed)}" data-action="set-done" data-wex="${esc(
              wex.id
            )}" data-set-id="${esc(s.id)}" aria-label="Seria ${srLabel} wykonana">${icon('check')}</button>
          </div>`;
        })
        .join('');
      return `<section class="card wex" data-key="wex-${esc(wex.id)}" aria-label="${esc(name)}">
        <div class="wex-head">
          <button type="button" class="wex-title" data-action="open-exercise" data-id="${esc(wex.exerciseId)}">
            <span class="wex-name">${esc(name)}</span>
            <span class="row-meta">${meta}</span>
          </button>
          <button type="button" class="icon-btn" data-action="wex-menu" data-wex="${esc(wex.id)}" aria-label="Opcje: ${esc(name)}">${icon('more')}</button>
        </div>
        ${wex.note ? `<p class="wex-note">${esc(wex.note)}</p>` : ''}
        ${
          wex.skipped
            ? `<p class="wex-skipped">Pominięte. <button type="button" class="text-btn" data-action="wex-skip" data-wex="${esc(wex.id)}">Przywróć</button></p>`
            : `<div class="set-grid set-head" aria-hidden="true">${cols.map((c, i) => `<span class="${cols.length === 2 && i === 1 ? 'span-2' : ''}">${c}</span>`).join('')}<span></span></div>
              ${rows}
              <div class="wex-foot">
                ${
                  editing
                    ? `<button type="button" class="btn btn-sm btn-gray" data-action="wex-edit" data-wex="${esc(wex.id)}">Gotowe</button>`
                    : `<button type="button" class="btn btn-sm btn-gray" data-action="set-add" data-wex="${esc(wex.id)}" data-type="working">${icon('plus')}Seria</button>
                       <button type="button" class="btn btn-sm btn-gray" data-action="set-add" data-wex="${esc(wex.id)}" data-type="warmup">Rozgrzewka</button>`
                }
              </div>`
        }
      </section>`;
    }

    function renderRestBar(a, blocked) {
      if (!a || !a.restEndsAt) return '';
      return `<div class="rest-bar" data-key="rest-bar" ${blocked ? 'inert' : ''}>
        <div class="rest-inner" role="timer" aria-label="Przerwa">
          <span class="rest-fill" data-live data-rest-fill data-keep-style aria-hidden="true"></span>
          <button type="button" class="rest-btn" data-action="rest-adjust" data-delta="-15" aria-label="Skróć o 15 sekund">−15</button>
          <div class="rest-time"><strong data-live data-rest-left></strong><span>przerwa</span></div>
          <button type="button" class="rest-btn" data-action="rest-adjust" data-delta="15" aria-label="Wydłuż o 15 sekund">+15</button>
          <button type="button" class="rest-btn primary" data-action="rest-skip">Pomiń</button>
        </div>
      </div>`;
    }

    /* ---------- Plany ---------- */
    function viewPlans() {
      const plans = state.plans.filter((p) => !p.archived);
      const visibleEx = state.exercises.filter((e) => !e.archived).length;
      return `
        <section class="section">
          ${
            plans.length
              ? `<ul class="card list">${plans
                  .map((p) => {
                    const sets = (p.exercises || []).reduce((n, e) => n + (Number(e.targetSets) || 0), 0);
                    return `<li data-key="p-${esc(p.id)}"><div class="row">
                      <button type="button" class="row-main" data-action="edit-plan" data-id="${esc(p.id)}">
                        <span class="row-text"><span class="row-title">${esc(p.name)}</span>
                        <span class="row-meta">${esc(daysLabel(p.scheduledDays))} · ${pl((p.exercises || []).length, 'ćwiczenie', 'ćwiczenia', 'ćwiczeń')} · ${pl(sets, 'seria', 'serie', 'serii')}</span></span>
                      </button>
                      <button type="button" class="btn btn-sm btn-tinted" data-action="start-plan" data-id="${esc(p.id)}" aria-label="Rozpocznij: ${esc(p.name)}">${icon('play')}Start</button>
                    </div></li>`;
                  })
                  .join('')}</ul>`
              : `<section class="card empty"><h2>Nie masz jeszcze planów</h2><p>Plan to lista ćwiczeń z seriami. Przypisz dni tygodnia, a trening pojawi się na ekranie Dzisiaj.</p>
                  <button type="button" class="btn btn-filled" data-action="new-plan">Nowy plan</button></section>`
          }
        </section>
        <section class="section">
          <div class="section-head"><h2 class="section-title">Biblioteka</h2></div>
          <ul class="card list">
            ${navRow('Ćwiczenia', 'open-catalog', { value: String(visibleEx) })}
            ${navRow('Pusty trening', 'start-empty', { sub: 'Dodawaj ćwiczenia na bieżąco' })}
          </ul>
        </section>
        <section class="section">
          <div class="section-head"><h2 class="section-title">Mobilność</h2><button type="button" class="section-action" data-action="new-routine">Dodaj</button></div>
          ${
            state.routines.length
              ? `<ul class="card list">${state.routines
                  .map((r) =>
                    navRow(esc(r.name), 'edit-routine', {
                      key: `rt-${esc(r.id)}`,
                      attrs: `data-id="${esc(r.id)}"`,
                      sub: `${r.durationMin || 10} min · ${esc(daysLabel(r.assignedDays))}`
                    })
                  )
                  .join('')}</ul>`
              : '<p class="muted-note" style="padding:0 0.25rem">Brak rutyn.</p>'
          }
        </section>`;
    }

    function searchExercises(q, muscle, { includeArchived = false } = {}) {
      const tokens = norm(q).split(' ').filter(Boolean);
      return state.exercises
        .filter((e) => includeArchived || !e.archived)
        .filter((e) => !muscle || (e.primaryMuscles || []).includes(muscle) || (muscle === BR && (e.primaryMuscles || []).includes(BR)))
        .filter((e) => {
          if (!tokens.length) return true;
          const hay = norm(`${e.name} ${e.category} ${(e.primaryMuscles || []).join(' ')} ${e.renamedFrom || ''}`);
          return tokens.every((t) => hay.includes(t));
        })
        .sort((a, b) => a.name.localeCompare(b.name, 'pl'));
    }
    function recentExerciseIds(limit = 8) {
      const seen = [];
      const list = completed().sort((a, b) => b.date.localeCompare(a.date) || (b.finishedAt || 0) - (a.finishedAt || 0));
      for (const w of list) {
        for (const ex of w.exercises || []) {
          if (!seen.includes(ex.exerciseId) && findEx(ex.exerciseId) && !findEx(ex.exerciseId).archived) seen.push(ex.exerciseId);
          if (seen.length >= limit) return seen;
        }
      }
      return seen;
    }
    function muscleChips(selected, action) {
      return `<div class="chip-scroll" role="group" aria-label="Partia mięśniowa">
        <button type="button" class="chip" data-action="${action}" data-value="" aria-pressed="${!selected}">Wszystkie</button>
        ${MUSCLES.map((m) => `<button type="button" class="chip" data-action="${action}" data-value="${esc(m)}" aria-pressed="${selected === m}">${m === IN ? 'Cardio i inne' : m}</button>`).join('')}
      </div>`;
    }
    const exMeta = (e) => [e.category, (e.primaryMuscles || []).join(', ')].filter(Boolean).join(' · ');

    function viewCatalog() {
      const { q, muscle } = state.catalog;
      const list = searchExercises(q, muscle);
      const archived = state.exercises.filter((e) => e.archived);
      let body;
      if (!list.length) body = `<p class="muted-note" style="padding:0.5rem 0.25rem">Nic nie pasuje. <button type="button" class="text-btn" data-action="new-exercise">Utwórz ćwiczenie</button></p>`;
      else {
        const firstMuscle = (e) => (MUSCLES.includes((e.primaryMuscles || [])[0]) ? e.primaryMuscles[0] : IN);
        const groups = !q && !muscle ? MUSCLES.map((m) => [m, list.filter((e) => firstMuscle(e) === m)]).filter((g) => g[1].length) : [['', list]];
        body = groups
          .map(
            ([m, items]) => `<section class="section" data-key="cg-${esc(m || 'all')}">
              ${m ? `<div class="section-head"><h2 class="section-title">${m === IN ? 'Cardio i inne' : m}</h2></div>` : ''}
              <ul class="card list">${items
                .map((e) => navRow(esc(e.name), 'open-exercise', { key: `ce-${esc(e.id)}`, attrs: `data-id="${esc(e.id)}"`, sub: esc(exMeta(e)) }))
                .join('')}</ul>
            </section>`
          )
          .join('');
      }
      return `<label class="search"><span class="sr-only">Szukaj ćwiczenia</span>${icon('search')}
          <input type="search" data-catalog-q value="${esc(q)}" placeholder="Szukaj" autocomplete="off" enterkeyhint="search" /></label>
        ${muscleChips(muscle, 'catalog-muscle')}
        ${body}
        ${
          archived.length && !q
            ? `<section class="section"><div class="section-head"><h2 class="section-title">Ukryte</h2></div>
                <ul class="card list">${archived.map((e) => navRow(esc(e.name), 'open-exercise', { key: `ca-${esc(e.id)}`, attrs: `data-id="${esc(e.id)}"`, sub: esc(exMeta(e)) })).join('')}</ul></section>`
            : ''
        }`;
    }

    /* ---------- Postępy ---------- */
    const RANGES = [
      [7, '7 dni'],
      [28, '4 tyg.'],
      [90, '3 mies.'],
      [365, 'Rok']
    ];
    function viewProgress() {
      const seg = state.progress.seg;
      const head = `<div class="seg-wrap">${segmented(
        [
          ['training', 'Trening'],
          ['muscles', 'Partie'],
          ['body', 'Ciało'],
          ['history', 'Historia']
        ],
        seg,
        'progress-seg',
        'Widok postępów'
      )}</div>`;
      if (seg === 'muscles') return head + viewMuscles();
      if (seg === 'body') return head + viewBody();
      if (seg === 'history') return head + viewHistory();
      return head + viewTraining();
    }
    function rangeSeg() {
      return `<div class="seg-wrap">${segmented(RANGES, state.progress.range, 'progress-range', 'Zakres')}</div>`;
    }

    function viewTraining() {
      const range = state.progress.range;
      const to = state.today;
      const from = addDays(to, -(range - 1));
      const prevTo = addDays(from, -1);
      const prevFrom = addDays(prevTo, -(range - 1));
      const cur = completed().filter((w) => inRange(w, from, to));
      const prev = completed().filter((w) => inRange(w, prevFrom, prevTo));
      const sum = (list) =>
        list.reduce(
          (acc, w) => {
            const s = workoutSummary(w);
            acc.volume += s.volume;
            acc.sets += s.sets;
            acc.reps += s.reps;
            return acc;
          },
          { volume: 0, sets: 0, reps: 0 }
        );
      const c = sum(cur);
      const p = sum(prev);
      const delta = p.volume > 0 ? Math.round(((c.volume - p.volume) / p.volume) * 100) : null;

      const metric = state.progress.metric;
      const cw = weekStart(state.today, ws());
      const weeks = [...Array(6)].map((_, i) => {
        const s = addDays(cw, -(5 - i) * 7);
        const e = addDays(s, 6);
        const t = sum(completed().filter((w) => inRange(w, s, e)));
        return { start: s, value: metric === 'volume' ? toMass(t.volume) : metric === 'sets' ? t.sets : t.reps };
      });
      const maxV = Math.max(1, ...weeks.map((w) => w.value));

      const exId = state.progress.exId && findEx(state.progress.exId) ? state.progress.exId : recentExerciseIds(1)[0] || null;
      let exBlock = '<p class="chart-empty">Wybierz ćwiczenie, aby zobaczyć jego progres.</p>';
      if (exId) exBlock = exerciseProgressBlock(findEx(exId));

      return `${rangeSeg()}
        <div class="stats two section">
          <div class="stat"><div class="stat-label">Treningi</div><div class="stat-value">${cur.length}</div></div>
          <div class="stat"><div class="stat-label">Serie robocze</div><div class="stat-value">${c.sets}</div></div>
          <div class="stat"><div class="stat-label">Objętość</div><div class="stat-value">${fmtNum(toMass(c.volume), 0)}<span class="unit">${massUnit()}</span></div>
            <div class="stat-sub ${delta === null ? '' : delta >= 0 ? 'delta-up' : 'delta-down'}">${
        delta === null ? 'ciężar × powtórzenia' : `${delta >= 0 ? '+' : '−'}${Math.abs(delta)}% vs poprzedni okres`
      }</div></div>
          <div class="stat"><div class="stat-label">Powtórzenia</div><div class="stat-value">${fmtNum(c.reps, 0)}</div></div>
        </div>
        <section class="card section">
          <div class="card-head"><h2 class="card-title">Ostatnie 6 tygodni</h2></div>
          <div style="padding:0 1rem">${segmented(
            [
              ['volume', 'Objętość'],
              ['sets', 'Serie'],
              ['reps', 'Powtórzenia']
            ],
            metric,
            'progress-metric',
            'Miara'
          )}</div>
          <div class="bars" role="img" aria-label="${esc(weeks.map((w) => `${shortDate(w.start)}: ${fmtNum(w.value, 0)}`).join(', '))}">
            ${weeks
              .map(
                (w, i) => `<div class="bar ${i === 5 ? 'current' : ''}"><span class="bar-val">${w.value ? fmtNum(w.value, 0) : ''}</span>
                  <span class="bar-fill" style="height:${Math.max(2, Math.round((w.value / maxV) * 100))}%"></span></div>`
              )
              .join('')}
          </div>
          <div class="bar-labels" aria-hidden="true">${weeks.map((w) => `<span>${shortDate(w.start)}</span>`).join('')}</div>
        </section>
        <section class="card section">
          <ul class="list">${navRow('Ćwiczenie', 'progress-pick-ex', { value: exId ? esc(findEx(exId).name) : 'Wybierz' })}</ul>
          ${exBlock}
        </section>
        ${goalsSection()}`;
    }

    function exerciseProgressBlock(e) {
      const h = exHistory(e.id);
      const mt = e.measureType || W;
      if (!h.entries.length) return '<p class="chart-empty">Brak zapisanych serii tego ćwiczenia.</p>';
      let points;
      let fmt;
      let stats;
      if (mt === W) {
        points = h.entries.map((en) => ({ date: en.date, value: toMass(en.metrics.maxW) })).filter((p) => p.value > 0);
        fmt = (v) => `${fmtNum(v)} ${massUnit()}`;
        stats = [
          ['Najwyższy ciężar', h.best.weight ? fmtMass(h.best.weight) : '—', h.best.repsAtWeight ? `× ${h.best.repsAtWeight}` : ''],
          ['Szac. max', h.best.e1rm ? fmtMass(h.best.e1rm) : '—', '1 powtórzenie'],
          ['Treningi', String(h.entries.length), '']
        ];
      } else if (mt === B) {
        points = h.entries.map((en) => ({ date: en.date, value: en.metrics.bestReps }));
        fmt = (v) => `${fmtNum(v, 0)} powt.`;
        stats = [
          ['Najwięcej powtórzeń', String(h.best.reps), 'w serii'],
          ['Treningi', String(h.entries.length), '']
        ];
      } else if (mt === T) {
        points = h.entries.map((en) => ({ date: en.date, value: Math.max(...en.sets.map((s) => n0(s.timeSec))) }));
        fmt = (v) => fmtDuration(v);
        stats = [
          ['Najdłużej', fmtDuration(h.best.time), ''],
          ['Treningi', String(h.entries.length), '']
        ];
      } else {
        points = h.entries.map((en) => ({ date: en.date, value: toDist(en.metrics.dist) }));
        fmt = (v) => `${fmtNum(v, 2)} ${distUnit()}`;
        stats = [
          ['Najdalej', fmtDist(h.best.dist), ''],
          ['Treningi', String(h.entries.length), '']
        ];
      }
      return `<div class="stats ${stats.length === 2 ? 'two' : ''}" style="padding:0.25rem 1rem 0; margin-bottom:0">
          ${stats.map(([l, v, s]) => `<div class="stat" style="background:var(--bg)"><div class="stat-label">${l}</div><div class="stat-value" style="font-size:1.15rem">${esc(v)}</div>${s ? `<div class="stat-sub">${esc(s)}</div>` : ''}</div>`).join('')}
        </div>
        ${points.length >= 2 ? lineChart(points.slice(-20), fmt, e.name) : '<p class="chart-empty" style="padding-top:0.75rem">Wykres pojawi się po drugim treningu z tym ćwiczeniem.</p>'}`;
    }

    function goalProgress(g) {
      const cw = weekStart(state.today, ws());
      if (g.type === 'weekly_workouts') {
        const done = completed().filter((w) => inRange(w, cw, addDays(cw, 6))).length;
        return { title: `${pl(Number(g.targetValue) || 0, 'trening', 'treningi', 'treningów')} w tygodniu`, now: `${done} z ${g.targetValue}`, ratio: Math.min(1, done / (Number(g.targetValue) || 1)) };
      }
      if (g.type === 'exercise_weight') {
        const e = findEx(g.exerciseId);
        const best = exHistory(g.exerciseId).best.weight;
        return { title: `${e ? e.name : 'Ćwiczenie'}: ${fmtMass(g.targetValue)}`, now: best ? fmtMass(best) : '—', ratio: Math.min(1, best / (Number(g.targetValue) || 1)) };
      }
      if (g.type === 'body_weight') {
        const list = state.measurements.filter((m) => m.metricId === 'm_weight').sort((a, b) => a.date.localeCompare(b.date));
        const first = list[0];
        const last = list[list.length - 1];
        let ratio = 0;
        if (first && last) {
          const total = Math.abs(Number(g.targetValue) - Number(first.value)) || 1;
          ratio = Math.max(0, Math.min(1, 1 - Math.abs(Number(g.targetValue) - Number(last.value)) / total));
        }
        return { title: `Masa ciała: ${fmtMass(g.targetValue)}`, now: last ? fmtMass(last.value) : '—', ratio };
      }
      return { title: g.title || 'Cel', now: '', ratio: 0 };
    }
    function goalsSection() {
      return `<section class="section">
        <div class="section-head"><h2 class="section-title">Cele</h2><button type="button" class="section-action" data-action="new-goal">Dodaj</button></div>
        ${
          state.goals.length
            ? `<ul class="card list">${state.goals
                .map((g) => {
                  const gp = goalProgress(g);
                  return `<li data-key="g-${esc(g.id)}"><button type="button" class="goal-row" style="width:100%;text-align:left" data-action="edit-goal" data-id="${esc(g.id)}">
                    <div class="goal-top"><span>${esc(gp.title)}</span><span>${esc(gp.now)}</span></div>
                    <div class="meter ${gp.ratio >= 1 ? 'green' : ''}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(gp.ratio * 100)}" aria-label="${esc(gp.title)}"><span style="width:${Math.round(gp.ratio * 100)}%"></span></div>
                  </button></li>`;
                })
                .join('')}</ul>`
            : '<p class="muted-note" style="padding:0 0.25rem">Brak celów. Możesz ustawić liczbę treningów w tygodniu, ciężar w ćwiczeniu albo masę ciała.</p>'
        }
      </section>`;
    }

    function viewMuscles() {
      const to = state.today;
      const from = addDays(to, -(state.progress.range - 1));
      const counts = muscleSets(from, to);
      const trained = MUSCLES.filter((m) => counts[m]).sort((a, b) => counts[b] - counts[a]);
      const untrained = MUSCLES.filter((m) => !counts[m] && m !== IN);
      const max = Math.max(1, ...trained.map((m) => counts[m]));
      const weeks = state.progress.range / 7;
      return `${rangeSeg()}
        ${
          trained.length
            ? `<section class="card section"><ul class="list">${trained
                .map(
                  (m) => `<li class="muscle-row" data-key="mu-${esc(m)}">
                    <div class="muscle-top"><span>${m === IN ? 'Cardio i inne' : m}</span><span>${pl(counts[m], 'seria', 'serie', 'serii')}${
                    weeks >= 2 ? ` · ${fmtNum(counts[m] / weeks)}/tydz.` : ''
                  }</span></div>
                    <div class="meter" aria-hidden="true"><span style="width:${Math.round((counts[m] / max) * 100)}%"></span></div>
                  </li>`
                )
                .join('')}</ul></section>`
            : '<section class="card empty section"><h2>Brak serii w tym okresie</h2><p>Liczą się wykonane serie robocze, przypisane do głównej partii ćwiczenia.</p></section>'
        }
        ${untrained.length && trained.length ? `<p class="group-note">Bez serii w tym okresie: ${untrained.join(', ').toLowerCase()}.</p>` : ''}`;
    }

    function viewBody() {
      const metrics = allMetrics();
      const sel = metricById(state.progress.metricId);
      const entries = state.measurements
        .filter((m) => m.metricId === sel.id)
        .sort((a, b) => a.date.localeCompare(b.date) || (a.createdAt || 0) - (b.createdAt || 0));
      const isMass = sel.category === 'mass';
      const disp = (v) => (isMass ? toMass(v) : Number(v));
      const unit = isMass ? massUnit() : sel.baseUnit || 'cm';
      const last = entries[entries.length - 1];
      const prev = entries[entries.length - 2];
      const diff = last && prev ? disp(last.value) - disp(prev.value) : null;
      return `<div class="chip-scroll" role="group" aria-label="Pomiar">${metrics
        .map((m) => `<button type="button" class="chip" data-action="body-metric" data-value="${esc(m.id)}" aria-pressed="${m.id === sel.id}">${esc(m.name)}</button>`)
        .join('')}</div>
        <section class="card section">
          ${
            last
              ? `<div class="value-card">
                  <div class="kicker">${esc(sel.name)} · ${relDay(last.date, state.today)}</div>
                  <div class="big-value">${fmtNum(disp(last.value))} <span class="unit" style="font-size:1rem">${unit}</span></div>
                  <div class="session-meta">${
                    diff === null ? 'Dodaj kolejny pomiar, aby zobaczyć zmianę' : `${diff > 0 ? '+' : diff < 0 ? '−' : ''}${fmtNum(Math.abs(diff))} ${unit} od ${dayMonth(prev.date)}`
                  }</div>
                </div>
                ${lineChart(entries.slice(-30).map((e) => ({ date: e.date, value: disp(e.value) })), (v) => `${fmtNum(v)} ${unit}`, sel.name)}`
              : `<div class="empty"><h2>Brak pomiarów</h2><p>Zapisz pierwszy pomiar: ${esc(sel.name.toLowerCase())}.</p></div>`
          }
          <div style="padding:0 1rem 1rem"><button type="button" class="btn btn-tinted btn-block" data-action="new-measurement" data-metric="${esc(sel.id)}">Dodaj pomiar</button></div>
        </section>
        ${
          entries.length
            ? `<section class="section"><div class="section-head"><h2 class="section-title">Historia</h2></div>
                <ul class="card list">${[...entries]
                  .reverse()
                  .map((e) =>
                    navRow(`${fmtNum(disp(e.value))} ${unit}`, 'edit-measurement', { key: `me-${esc(e.id)}`, attrs: `data-id="${esc(e.id)}"`, sub: `${esc(longDate(e.date))}${e.note ? ` · ${esc(e.note)}` : ''}` })
                  )
                  .join('')}</ul></section>`
            : ''
        }`;
    }

    function viewHistory() {
      const list = completed().sort((a, b) => b.date.localeCompare(a.date) || (b.finishedAt || 0) - (a.finishedAt || 0));
      if (!list.length) return '<section class="card empty"><h2>Brak zapisanych treningów</h2><p>Po zakończeniu pierwszego treningu zobaczysz go tutaj.</p></section>';
      const groups = [];
      for (const w of list) {
        const key = w.date.slice(0, 7);
        let g = groups.find((x) => x.key === key);
        if (!g) {
          g = { key, items: [] };
          groups.push(g);
        }
        g.items.push(w);
      }
      return groups
        .map((g) => {
          const [y, m] = g.key.split('-').map(Number);
          return `<section class="section" data-key="hg-${g.key}"><div class="section-head"><h2 class="section-title">${cap(fmtMonthYear.format(new Date(y, m - 1, 1, 12)))}</h2>
            <span class="row-value">${pl(g.items.length, 'trening', 'treningi', 'treningów')}</span></div>
            <ul class="card list">${g.items
              .map((w) => {
                const s = workoutSummary(w);
                return navRow(esc(w.name), 'open-summary', {
                  key: `h-${esc(w.id)}`,
                  attrs: `data-id="${esc(w.id)}"`,
                  sub: [longDate(w.date), pl(s.sets, 'seria', 'serie', 'serii'), s.volume ? fmtMass(s.volume, 0) : ''].filter(Boolean).join(' · ')
                });
              })
              .join('')}</ul></section>`;
        })
        .join('');
    }

    /* ---------- Ustawienia ---------- */
    function viewSettings() {
      const s = state.settings;
      return `
        <div class="group"><h2 class="group-label">Wygląd</h2>
          <div class="card"><div class="settings-seg">${segmented(
            [
              ['system', 'Automatyczny'],
              ['light', 'Jasny'],
              ['dark', 'Ciemny']
            ],
            s.theme,
            'set-theme',
            'Motyw'
          )}</div></div>
        </div>
        <div class="group"><h2 class="group-label">Jednostki i kalendarz</h2>
          <ul class="card list">
            <li class="row"><span class="row-text"><span class="row-title">Ciężar</span></span>${segmented(
              [
                ['kg', 'kg'],
                ['lb', 'lb']
              ],
              massUnit(),
              'set-mass',
              'Jednostka ciężaru'
            )}</li>
            <li class="row"><span class="row-text"><span class="row-title">Dystans</span></span>${segmented(
              [
                ['km', 'km'],
                ['mi', 'mi']
              ],
              distUnit(),
              'set-dist',
              'Jednostka dystansu'
            )}</li>
            <li class="row"><span class="row-text"><span class="row-title">Pierwszy dzień tygodnia</span></span>${segmented(
              [
                ['1', 'Pn'],
                ['0', 'Nd']
              ],
              String(ws()),
              'set-week',
              'Pierwszy dzień tygodnia'
            )}</li>
          </ul>
        </div>
        <div class="group"><h2 class="group-label">Trening</h2>
          <ul class="card list">
            <li class="row"><span class="row-text"><span class="row-title">Serie w nowym ćwiczeniu</span></span>${stepper(Number(s.defaultSets) || 3, 'set-step', 'defaultSets', 'Serie w nowym ćwiczeniu', 1, 10)}</li>
            <li class="row"><label class="row-text" for="set-reps"><span class="row-title">Zakres powtórzeń</span></label>
              <input id="set-reps" class="input-inline" type="text" inputmode="text" data-setting="defaultReps" value="${esc(s.defaultReps || '8-10')}" /></li>
            ${switchRow('Wliczaj rozgrzewki', 'Do objętości i statystyk', s.excludeWarmups === false, 'toggle-setting-inv', 'excludeWarmups')}
          </ul>
        </div>
        <div class="group"><h2 class="group-label">Przerwa między seriami</h2>
          <ul class="card list">
            ${switchRow('Minutnik po serii', 'Startuje po odhaczeniu serii', s.restTimer !== false, 'toggle-setting', 'restTimer')}
            <li><div class="field-stack"><span class="field-label">Domyślna długość</span>${segmented(
              [
                [60, '1:00'],
                [90, '1:30'],
                [120, '2:00'],
                [180, '3:00']
              ],
              Number(s.restDefault) || 90,
              'set-rest',
              'Domyślna przerwa'
            )}</div></li>
            ${switchRow('Sygnał na koniec', 'Gdy Forma jest na ekranie, a telefon nie jest wyciszony', s.restSound !== false, 'toggle-setting', 'restSound')}
            ${switchRow('Nie wygaszaj ekranu', 'Podczas treningu', s.keepAwake !== false, 'toggle-setting', 'keepAwake')}
          </ul>
        </div>
        <div class="group"><h2 class="group-label">Dane</h2>
          <ul class="card list">
            ${actionRow('Zapisz kopię', 'export-json', { sub: 'Plik JSON ze wszystkimi danymi' })}
            ${actionRow('Przywróć z kopii', 'import-json')}
            ${actionRow('Eksportuj treningi', 'csv-workouts', { sub: 'Arkusz CSV dla Excela i Numbers' })}
            ${actionRow('Eksportuj pomiary i aktywności', 'csv-body', { sub: 'Arkusz CSV dla Excela i Numbers' })}
          </ul>
          <p class="group-note">Wszystko jest zapisane tylko na tym urządzeniu. Przed usunięciem Formy z ekranu początkowego zapisz kopię — inaczej dane przepadną.</p>
        </div>
        <div class="group"><ul class="card list">${actionRow('Usuń wszystkie dane', 'clear-all', { tone: 'danger' })}</ul></div>
        <p class="app-foot">Forma ${APP_VERSION}</p>`;
    }

    /* ---------- Menu, toast ---------- */
    function renderMenu() {
      const items =
        state.menu === 'today'
          ? [
              ['start-picker', 'Trening', 'play'],
              ['new-activity', 'Aktywność', 'walk'],
              ['new-measurement', 'Pomiar', 'ruler']
            ]
          : [];
      return `<div class="menu-layer" data-key="menu-layer">
        <div class="menu-dismiss" data-action="menu-close"></div>
        <div class="menu" role="menu" aria-label="Dodaj">${items
          .map(([a, l, ic]) => `<button type="button" role="menuitem" data-action="${a}" data-date="${state.day}">${l}${icon(ic)}</button>`)
          .join('')}</div>
      </div>`;
    }
    function renderToast() {
      const t = state.toast;
      return `<div class="toast ${t.undo ? 'has-action' : ''} ${t.closing ? 'closing' : ''}" data-key="toast-${t.id}">
        <span>${esc(t.text)}</span>${t.undo ? '<button type="button" class="toast-action" data-action="toast-undo">Cofnij</button>' : ''}
      </div>`;
    }
    let toastTimer = null;
    function toast(text, undo = null) {
      state.toast = { id: Date.now(), text, undo, closing: false };
      render();
      clearTimeout(toastTimer);
      toastTimer = setTimeout(dismissToast, undo ? 5000 : 2600);
    }
    function dismissToast() {
      const t = state.toast;
      if (!t || t.closing) return;
      t.closing = true;
      render();
      setTimeout(() => {
        if (state.toast === t) {
          state.toast = null;
          render();
        }
      }, 200);
    }

    /* ============================================================
       Arkusze
       ============================================================ */
    const sheetBtn = (label, action, primary = false, attrs = '') =>
      `<button type="button" class="sheet-btn ${primary ? 'primary' : ''}" data-action="${action}" ${attrs}>${label}</button>`;

    function renderSheet() {
      const s = state.sheet;
      const builder = SHEETS[s.type];
      const r = builder ? builder(s) : null;
      if (!r) return '';
      const head = r.alert
        ? ''
        : `<header class="sheet-head" data-drag-handle>
            <span class="grabber" aria-hidden="true"></span>
            ${r.left || sheetBtn(s.prev ? 'Wróć' : 'Anuluj', 'sheet-cancel')}
            <h2 class="sheet-title" id="sheet-title" tabindex="-1">${r.title}</h2>
            ${r.right || '<span></span>'}
          </header>`;
      return `<div class="sheet-layer ${s.closing ? 'closing' : ''}" data-key="sheet-layer">
        <div class="scrim" data-action="sheet-dismiss" data-keep-style></div>
        <section class="sheet ${r.cls || ''}" role="dialog" aria-modal="true" aria-labelledby="sheet-title" data-keep-style data-key="sheet">
          ${head}
          <div class="sheet-body">${r.body}</div>
        </section>
      </div>`;
    }

    const alertSheet = (title, text, actions) => ({
      alert: true,
      cls: 'alert-sheet',
      body: `<h2 id="sheet-title" tabindex="-1">${title}</h2>${text ? `<p>${text}</p>` : '<div style="height:1.25rem"></div>'}
        <div class="alert-actions">${actions.map(([label, action, tone, attrs = '']) => `<button type="button" class="btn btn-block ${tone}" data-action="${action}" ${attrs}>${label}</button>`).join('')}</div>`
    });

    const SHEETS = {
      startPicker(s) {
        const plans = state.plans.filter((p) => !p.archived);
        const todays = plans.filter((p) => (p.scheduledDays || []).includes(dow(s.date)));
        const others = plans.filter((p) => !todays.includes(p));
        const row = (p) =>
          navRow(esc(p.name), 'start-plan', {
            key: `sp-${esc(p.id)}`,
            attrs: `data-id="${esc(p.id)}" data-date="${s.date}"`,
            sub: `${pl((p.exercises || []).length, 'ćwiczenie', 'ćwiczenia', 'ćwiczeń')}${todays.includes(p) ? ' · zaplanowany' : ''}`
          });
        return {
          title: 'Rozpocznij trening',
          body: `${s.date !== state.today ? `<p class="sheet-sub">${esc(longDate(s.date))}</p>` : ''}
            <ul class="card list">${navRow('Pusty trening', 'start-empty', { sub: 'Dodawaj ćwiczenia na bieżąco', attrs: `data-date="${s.date}"` })}</ul>
            ${plans.length ? `<ul class="card list">${[...todays, ...others].map(row).join('')}</ul>` : ''}`
        };
      },

      exPicker(s) {
        const multi = s.mode === 'add-session' || s.mode === 'add-plan';
        const list = searchExercises(s.q, s.muscle);
        const recents = !s.q && !s.muscle ? recentExerciseIds(6).map(findEx).filter(Boolean) : [];
        const row = (e, prefix) => {
          const on = s.selected.includes(e.id);
          return `<li data-key="${prefix}-${esc(e.id)}"><div class="row">
            <button type="button" class="row-main" data-action="picker-toggle" data-id="${esc(e.id)}" ${multi ? `aria-pressed="${on}"` : ''}>
              ${multi ? `<span class="pick-check" aria-hidden="true">${icon('check')}</span>` : ''}
              <span class="row-text"><span class="row-title">${esc(e.name)}</span><span class="row-meta">${esc(exMeta(e))}</span></span>
            </button>
          </div></li>`;
        };
        const titles = { 'add-session': 'Dodaj ćwiczenia', 'add-plan': 'Dodaj ćwiczenia', replace: 'Zamień ćwiczenie', progress: 'Wybierz ćwiczenie', goal: 'Wybierz ćwiczenie', merge: 'Połącz z…' };
        return {
          title: titles[s.mode] || 'Ćwiczenia',
          right: multi ? sheetBtn(s.selected.length ? `Dodaj (${s.selected.length})` : 'Dodaj', 'picker-confirm', true, s.selected.length ? '' : 'disabled') : '',
          body: `${s.mode === 'merge' ? '<p class="sheet-sub">Historia i plany tego ćwiczenia przejdą do wybranego, a ono samo zniknie.</p>' : ''}
            <label class="search"><span class="sr-only">Szukaj ćwiczenia</span>${icon('search')}
            <input type="search" data-picker-q value="${esc(s.q)}" placeholder="Szukaj" autocomplete="off" enterkeyhint="search" /></label>
            ${muscleChips(s.muscle, 'picker-muscle')}
            ${recents.length ? `<div class="card" style="margin-bottom:1rem"><p class="list-label">Ostatnio używane</p><ul class="list">${recents.map((e) => row(e, 'pr')).join('')}</ul></div>` : ''}
            ${
              list.length
                ? `<div class="card">${recents.length ? '<p class="list-label">Wszystkie</p>' : ''}<ul class="list">${list
                    .filter((e) => s.mode !== 'merge' || e.id !== s.sourceId)
                    .map((e) => row(e, 'pa'))
                    .join('')}</ul></div>`
                : '<p class="muted-note" style="padding:0.5rem 0.25rem">Nic nie pasuje.</p>'
            }
            ${s.mode !== 'merge' ? `<ul class="card list" style="margin-top:1rem">${actionRow('Utwórz nowe ćwiczenie', 'picker-create')}</ul>` : ''}`
        };
      },

      wexMenu(s) {
        const a = getActive();
        const wex = a && a.exercises.find((x) => x.id === s.wexId);
        if (!wex) return null;
        const i = a.exercises.indexOf(wex);
        return {
          title: esc(exName(wex)),
          left: sheetBtn('Gotowe', 'sheet-cancel'),
          body: `<ul class="card list">
              <li><div class="field-stack"><span class="field-label">Przerwa po serii</span>${segmented(
                [
                  [60, '1:00'],
                  [90, '1:30'],
                  [120, '2:00'],
                  [180, '3:00']
                ],
                Number(wex.restSeconds) || Number(state.settings.restDefault) || 90,
                'wex-rest',
                'Przerwa po serii'
              )}</div></li>
            </ul>
            <ul class="card list">
              ${actionRow('Przesuń wyżej', 'wex-move', { attrs: `data-dir="-1" ${i === 0 ? 'disabled' : ''}` })}
              ${actionRow('Przesuń niżej', 'wex-move', { attrs: `data-dir="1" ${i === a.exercises.length - 1 ? 'disabled' : ''}` })}
              ${actionRow(state.editSets[wex.id] ? 'Zakończ edycję serii' : 'Usuń serie…', 'wex-edit', { attrs: `data-wex="${esc(wex.id)}"` })}
              ${actionRow('Zamień ćwiczenie', 'wex-replace')}
              ${actionRow(wex.skipped ? 'Przywróć ćwiczenie' : 'Pomiń ćwiczenie', 'wex-skip', { attrs: `data-wex="${esc(wex.id)}"` })}
            </ul>
            <ul class="card list">${actionRow('Usuń z treningu', 'wex-remove', { tone: 'danger' })}</ul>`
        };
      },

      sessionMeta(s) {
        const f = s.form;
        return {
          title: 'Trening',
          right: sheetBtn('Zapisz', 'sheet-save', true),
          body: `<form data-form novalidate>
            <div class="card"><div class="field"><input class="input" type="text" data-field="name" value="${esc(f.name)}" aria-label="Nazwa treningu" maxlength="60" enterkeyhint="done" /></div></div>
            <ul class="card list"><li class="row"><label class="row-text" for="f-date"><span class="row-title">Data</span></label>
              <input id="f-date" class="input-time" type="date" data-field="date" value="${esc(f.date)}" /></li></ul>
            <div class="card"><div class="field"><input class="input" type="text" data-field="note" value="${esc(f.note)}" placeholder="Notatka (opcjonalnie)" aria-label="Notatka" maxlength="200" enterkeyhint="done" /></div></div>
            <ul class="card list">${actionRow('Odrzuć trening', 'session-discard', { tone: 'danger', sub: 'Serie z tej sesji nie zostaną zapisane' })}</ul>
            <button type="submit" class="sr-only" tabindex="-1" aria-hidden="true">Zapisz</button>
          </form>`
        };
      },

      finishEmpty() {
        return alertSheet('Brak wykonanych serii', 'Odhacz serie, które zrobiłeś, albo odrzuć ten trening.', [
          ['Wróć do treningu', 'sheet-cancel', 'btn-filled'],
          ['Odrzuć trening', 'session-discard', 'btn-gray']
        ]);
      },

      staleSession(s) {
        const a = getActive();
        if (!a) return null;
        return alertSheet(
          'Trening wciąż otwarty',
          `„${esc(a.name)}” z ${esc(dayMonth(a.date))} nie został zakończony.`,
          [
            ['Zakończ i zapisz', 'stale-finish', 'btn-filled'],
            ['Kontynuuj', 'stale-continue', 'btn-gray'],
            ['Odrzuć', 'session-discard', 'btn-gray']
          ]
        );
      },

      summary(s) {
        const w = state.workouts.find((x) => x.id === s.id);
        if (!w) return null;
        const sum = workoutSummary(w);
        const prs = s.prs || [];
        return {
          title: esc(w.name),
          left: sheetBtn('Zamknij', 'sheet-cancel'),
          body: `<p class="sheet-sub">${esc(longDate(w.date))}${sum.minutes ? ` · ${fmtMinutes(sum.minutes)}` : ''}</p>
            <div class="stats">
              <div class="stat"><div class="stat-label">Serie</div><div class="stat-value">${sum.sets}</div>${sum.warm ? `<div class="stat-sub">+${sum.warm} rozgrz.</div>` : ''}</div>
              <div class="stat"><div class="stat-label">Ćwiczenia</div><div class="stat-value">${sum.exercises}</div></div>
              <div class="stat"><div class="stat-label">Objętość</div><div class="stat-value" style="font-size:1.2rem">${fmtNum(toMass(sum.volume), 0)}<span class="unit">${massUnit()}</span></div></div>
            </div>
            ${
              prs.length
                ? `<div class="card"><p class="list-label">Rekordy</p><ul class="list">${prs
                    .map((p) => `<li class="row"><span class="row-text"><span class="row-title">${esc(p.name)}</span><span class="row-meta">${esc(p.text)}</span></span></li>`)
                    .join('')}</ul></div>`
                : ''
            }
            ${w.note ? `<p class="muted-note" style="margin:0 0.25rem 1rem">${esc(w.note)}</p>` : ''}
            <ul class="card list">${(w.exercises || [])
              .filter((ex) => !ex.skipped && (ex.sets || []).some((st) => st.completed))
              .map(
                (ex) => `<li class="row"><button type="button" class="row-main" data-action="open-exercise" data-id="${esc(ex.exerciseId)}"><span class="row-text">
                  <span class="row-title">${esc(exName(ex))}</span>
                  <span class="sets-line">${esc(setsText((ex.sets || []).filter((st) => st.completed), ex.measureType || W)) || 'tylko rozgrzewka'}</span></span>${icon('chevR', 'chev')}</button></li>`
              )
              .join('')}</ul>
            ${s.fresh ? '' : `<ul class="card list">${actionRow('Usuń trening', 'workout-delete', { tone: 'danger', attrs: `data-id="${esc(w.id)}"` })}</ul>`}`
        };
      },

      planForm(s) {
        const f = s.form;
        return {
          title: f.isEdit ? 'Edytuj plan' : 'Nowy plan',
          right: sheetBtn(f.isEdit ? 'Zapisz' : 'Utwórz', 'sheet-save', true),
          body: `<form data-form novalidate>
            ${f.error ? `<div class="alert" role="alert">${esc(f.error)}</div>` : ''}
            ${!f.isEdit ? `<div class="chips">${PLAN_PRESETS.map((p) => `<button type="button" class="chip" data-action="plan-preset" data-value="${p}">${p}</button>`).join('')}</div>` : ''}
            <div class="card"><div class="field"><input class="input" type="text" data-field="name" value="${esc(f.name)}" placeholder="Nazwa, np. Push A" aria-label="Nazwa planu" maxlength="60" enterkeyhint="done" /></div></div>
            <div class="card"><div class="field-stack"><span class="field-label">Dni tygodnia</span>${dayChips(f.days, 'plan-day')}</div></div>
            <div class="card">
              <p class="list-label">${f.items.length ? pl(f.items.length, 'ćwiczenie', 'ćwiczenia', 'ćwiczeń') : 'Ćwiczenia'}</p>
              <ul class="list">
                ${f.items
                  .map((it, i) =>
                    navRow(esc(findEx(it.exerciseId)?.name || it.exerciseName), 'plan-item', {
                      key: `pi-${i}-${esc(it.exerciseId)}`,
                      attrs: `data-index="${i}"`,
                      sub: `${it.targetSets} × ${esc(String(it.targetReps || '').replace('-', '–'))}${it.targetWeightKg ? ` · ${fmtMass(it.targetWeightKg)}` : ''} · przerwa ${fmtDuration(Number(it.restSeconds) || Number(state.settings.restDefault) || 90)}`
                    })
                  )
                  .join('')}
                ${actionRow('Dodaj ćwiczenia', 'plan-add-ex')}
              </ul>
            </div>
            ${f.isEdit ? `<ul class="card list">${actionRow('Usuń plan', 'plan-delete', { tone: 'danger', sub: 'Historia treningów zostaje' })}</ul>` : ''}
            <button type="submit" class="sr-only" tabindex="-1" aria-hidden="true">Zapisz</button>
          </form>`
        };
      },

      planItem(s) {
        const pf = s.prev && s.prev.form;
        const it = pf && pf.items[s.index];
        if (!it) return null;
        const mt = findEx(it.exerciseId)?.measureType || W;
        return {
          title: esc(findEx(it.exerciseId)?.name || it.exerciseName),
          left: sheetBtn('Gotowe', 'sheet-cancel'),
          body: `<ul class="card list">
              <li class="row"><span class="row-text"><span class="row-title">Serie</span></span>${stepper(Number(it.targetSets) || 3, 'item-step', 'targetSets', 'Serie', 1, 12)}</li>
              ${
                mt === W || mt === B
                  ? `<li class="row"><label class="row-text" for="f-reps"><span class="row-title">Powtórzenia</span></label>
                      <input id="f-reps" class="input-inline" type="text" data-item="targetReps" value="${esc(it.targetReps || '')}" placeholder="8-10" /></li>`
                  : ''
              }
              ${
                mt === W
                  ? `<li class="row"><label class="row-text" for="f-tw"><span class="row-title">Ciężar startowy</span><span class="row-meta">Opcjonalnie. Inaczej z ostatniego treningu</span></label>
                      <input id="f-tw" class="input-inline" type="text" inputmode="decimal" data-item="targetWeight" value="${esc(it.targetWeightKg ? inputNum(toMass(it.targetWeightKg)) : '')}" placeholder="${massUnit()}" /></li>`
                  : ''
              }
              <li><div class="field-stack"><span class="field-label">Przerwa po serii</span>${segmented(
                [
                  [60, '1:00'],
                  [90, '1:30'],
                  [120, '2:00'],
                  [180, '3:00']
                ],
                Number(it.restSeconds) || Number(state.settings.restDefault) || 90,
                'item-rest',
                'Przerwa po serii'
              )}</div></li>
            </ul>
            <ul class="card list">
              ${actionRow('Przesuń wyżej', 'item-move', { attrs: `data-dir="-1" ${s.index === 0 ? 'disabled' : ''}` })}
              ${actionRow('Przesuń niżej', 'item-move', { attrs: `data-dir="1" ${s.index === pf.items.length - 1 ? 'disabled' : ''}` })}
            </ul>
            <ul class="card list">${actionRow('Usuń z planu', 'item-remove', { tone: 'danger' })}</ul>`
        };
      },

      exDetail(s) {
        const e = findEx(s.id);
        if (!e) return null;
        const h = exHistory(e.id);
        const mt = e.measureType || W;
        return {
          title: esc(e.name),
          left: sheetBtn(s.prev ? 'Wróć' : 'Zamknij', 'sheet-cancel'),
          right: sheetBtn('Edytuj', 'edit-exercise', true, `data-id="${esc(e.id)}"`),
          body: `<p class="detail-meta">${esc([e.category, (e.primaryMuscles || []).join(', '), (e.secondaryMuscles || []).length ? `pomocniczo: ${e.secondaryMuscles.join(', ').toLowerCase()}` : ''].filter(Boolean).join(' · '))}${
            e.cues ? `<br>${esc(e.cues)}` : ''
          }</p>
            ${e.archived ? '<div class="notice">Ukryte — nie pojawia się przy wyborze ćwiczeń.</div>' : ''}
            <div class="card">${exerciseProgressBlock(e)}</div>
            ${
              h.entries.length
                ? `<div class="card"><p class="list-label">Historia</p><ul class="list">${[...h.entries]
                    .reverse()
                    .slice(0, s.all ? 999 : 12)
                    .map(
                      (en) => `<li class="row"><span class="row-text"><span class="row-title">${esc(longDate(en.date))}</span>
                        <span class="sets-line">${esc(setsText(en.sets, mt)) || 'tylko rozgrzewka'}</span></span></li>`
                    )
                    .join('')}
                    ${!s.all && h.entries.length > 12 ? actionRow(`Pokaż wszystkie (${h.entries.length})`, 'exdetail-all') : ''}</ul></div>`
                : ''
            }`
        };
      },

      exForm(s) {
        const f = s.form;
        const usage = f.isEdit ? exerciseUsage(f.id) : { workouts: 0, plans: 0 };
        return {
          title: f.isEdit ? 'Edytuj ćwiczenie' : 'Nowe ćwiczenie',
          right: sheetBtn(f.isEdit ? 'Zapisz' : 'Utwórz', 'sheet-save', true),
          body: `<form data-form novalidate>
            ${f.error ? `<div class="alert" role="alert">${esc(f.error)}</div>` : ''}
            <div class="card"><div class="field"><input class="input" type="text" data-field="name" value="${esc(f.name)}" placeholder="Nazwa ćwiczenia" aria-label="Nazwa ćwiczenia" maxlength="80" enterkeyhint="done" /></div></div>
            ${f.renamedFrom ? `<p class="group-note" style="margin:-0.75rem 0 1.25rem">Wcześniej: ${esc(f.renamedFrom)}</p>` : ''}
