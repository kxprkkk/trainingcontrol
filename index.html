                      </div>`
                    : activePlans
                        .map(
                          (p) => `
                        <div class="ios-row">
                          <div class="row-info">
                            <div class="row-title">${escapeHtml(p.name)}</div>
                            <div class="row-subtitle">${p.exercises.length} ćwiczeń</div>
                          </div>
                          <button type="button" data-action="start-plan-workout" data-plan-id="${escapeHtml(p.id)}" class="btn btn-primary">
                            Start
                          </button>
                        </div>
                      `
                        )
                        .join('')
                }
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderCompletedWorkoutSummaryModal() {
      if (!state.completedWorkoutSummaryId) return '';
      const w = state.workouts.find((x) => x.id === state.completedWorkoutSummaryId);
      if (!w) return '';

      const excludeWarmups = state.settings.excludeWarmups !== false;
      const sum = calculateWorkoutSessionSummary(w, excludeWarmups);

      return `
        <div class="modal-backdrop" role="dialog" aria-modal="true">
          <div class="modal-sheet">
            <div class="modal-topbar">
              <span style="font-size:16px; font-weight:700;">Podsumowanie treningu</span>
              <button type="button" data-action="close-workout-summary" class="btn btn-primary" style="padding:6px 12px;">Gotowe</button>
            </div>
            <div class="modal-body">
              <span class="pill pill-green">✓ Zapisano w historii • ${escapeHtml(w.date)}</span>
              <h2 style="font-size:20px; font-weight:700; margin-top:6px;">${escapeHtml(w.name)}</h2>
              ${w.note ? `<p style="font-size:13px; color:var(--text-secondary); margin-top:4px;">„${escapeHtml(w.note)}”</p>` : ''}

              <div class="stats-grid-4" style="margin-top:14px;">
                <div class="stat-box">
                  <div class="stat-label">Ćwiczenia</div>
                  <div class="stat-value">${sum.completedExercisesCount}</div>
                  <div class="stat-sub">wykonane</div>
                </div>
                <div class="stat-box">
                  <div class="stat-label">Serie robocze</div>
                  <div class="stat-value">${sum.workingSetsCount}</div>
                  <div class="stat-sub">+${sum.warmupSetsCount} rozgrz.</div>
                </div>
                <div class="stat-box">
                  <div class="stat-label">Powtórzenia</div>
                  <div class="stat-value">${sum.totalReps}</div>
                  <div class="stat-sub">łącznie</div>
                </div>
                <div class="stat-box">
                  <div class="stat-label">Tonaż sesji</div>
                  <div class="stat-value">${formatMass(sum.tonnageKg)}</div>
                  <div class="stat-sub">${sum.durationMin ? `${sum.durationMin} min` : 'objętość'}</div>
                </div>
              </div>

              <div class="ios-card">
                ${(w.exercises || [])
                  .filter((ex) => !ex.skipped)
                  .map((ex) => {
                    const doneSets = (ex.sets || []).filter((s) => s.completed);
                    if (doneSets.length === 0) return '';
                    const exM = calculateExerciseSessionMetrics(ex, excludeWarmups);
                    return `
                      <div class="ios-row-stack">
                        <div style="display:flex; justify-content:space-between;">
                          <strong style="font-size:14px;">${escapeHtml(ex.exerciseName)}</strong>
                          <span style="font-size:12px; color:var(--ios-blue); font-weight:700;">${formatMass(exM.tonnageKg)}</span>
                        </div>
                        <div style="font-size:12px; color:var(--text-secondary);">
                          ${doneSets
                            .map((s) => `${s.type === 'warmup' ? '[R] ' : ''}${formatMass(s.weightKg)} × ${s.reps}`)
                            .join(' • ')}
                        </div>
                      </div>
                    `;
                  })
                  .join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderBottomNav() {
      const t = state.activeTab;
      const hasActive = Boolean(getActiveWorkout());

      return `
        <nav class="bottom-nav" aria-label="Główna nawigacja">
          <div class="bottom-nav-inner">
            <button type="button" data-action="switch-tab" data-tab="today" class="nav-tab-btn ${t === 'today' ? 'active' : ''}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${t === 'today' ? '2.4' : '1.9'}">
                <rect x="3" y="4" width="18" height="18" rx="3" />
                <path stroke-linecap="round" d="M16 2v4M8 2v4M3 10h18" />
              </svg>
              <span>Dzisiaj</span>
            </button>

            <button type="button" data-action="switch-tab" data-tab="workout" class="nav-tab-btn ${t === 'workout' ? 'active' : ''}">
              ${hasActive ? `<span class="nav-live-dot"></span>` : ''}
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${t === 'workout' ? '2.4' : '1.9'}">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 7v10M18 7v10M3 9v6M21 9v6M6 12h12" />
              </svg>
              <span>Trening</span>
            </button>

            <button type="button" data-action="switch-tab" data-tab="progress" class="nav-tab-btn ${t === 'progress' ? 'active' : ''}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${t === 'progress' ? '2.4' : '1.9'}">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 19h16M7 16V10M12 16V6M17 16v-4" />
              </svg>
              <span>Postępy</span>
            </button>
          </div>
        </nav>
      `;
    }

    function renderApp() {
      const root = document.getElementById('app');
      if (!root) return;

      let mainHtml = '';
      if (state.activeTab === 'today') mainHtml = renderTodayView();
      else if (state.activeTab === 'workout') mainHtml = renderWorkoutView();
      else mainHtml = renderProgressView();

      root.innerHTML = `
        ${state.toast ? `<div class="toast-banner">${escapeHtml(state.toast)}</div>` : ''}
        ${renderStickyHeader()}
        <main class="main-container">${mainHtml}</main>
        ${renderBottomNav()}
        ${renderSettingsModal()}
        ${renderPlanModal()}
        ${renderExerciseDetailModal()}
        ${renderExerciseCreatorModal()}
        ${renderActivityModal()}
        ${renderMeasurementModal()}
        ${renderRoutineModal()}
        ${renderGoalModal()}
        ${renderWorkoutPickerModal()}
        ${renderCompletedWorkoutSummaryModal()}
      `;
    }

    /***********************************************************************
     * 14. OBSŁUGA ZDARZEŃ I AKTUALIZACJA POLA SERII NA ŻYWO
     ***********************************************************************/
    function syncPlanModalInputs() {
      if (!state.planForm) return;
      const nameEl = document.getElementById('pm-plan-name');
      if (nameEl) state.planForm.name = nameEl.value;
    }

    document.addEventListener('input', async (e) => {
      const el = e.target;
      if (!el) return;
      const action = el.getAttribute('data-action');
      const active = getActiveWorkout();

      if (active) {
        if (action === 'active-workout-name-input') {
          active.name = el.value;
          await persistActiveWorkout(active);
          return;
        }
        if (action === 'active-workout-date-input') {
          active.date = el.value || state.todayStr;
          await persistActiveWorkout(active);
          return;
        }
        if (action === 'active-workout-note-input') {
          active.note = el.value;
          await persistActiveWorkout(active);
          return;
        }
        if (action === 'set-weight-input') {
          const exIdx = Number(el.getAttribute('data-ex-index'));
          const sIdx = Number(el.getAttribute('data-set-index'));
          const setObj = active.exercises?.[exIdx]?.sets?.[sIdx];
          if (setObj) {
            setObj.weightKg = fromDisplayMassToKg(el.value, state.settings.massUnit);
            await persistActiveWorkout(active);
          }
          return;
        }
        if (action === 'set-reps-input') {
          const exIdx = Number(el.getAttribute('data-ex-index'));
          const sIdx = Number(el.getAttribute('data-set-index'));
          const setObj = active.exercises?.[exIdx]?.sets?.[sIdx];
          if (setObj) {
            setObj.reps = Math.max(0, parseInt(el.value, 10) || 0);
            await persistActiveWorkout(active);
          }
          return;
        }
        if (action === 'set-time-input') {
          const exIdx = Number(el.getAttribute('data-ex-index'));
          const sIdx = Number(el.getAttribute('data-set-index'));
          const setObj = active.exercises?.[exIdx]?.sets?.[sIdx];
          if (setObj) {
            setObj.timeSec = Math.max(0, parseInt(el.value, 10) || 0);
            await persistActiveWorkout(active);
          }
          return;
        }
      }

      if (state.planForm) {
        const idx = Number(el.getAttribute('data-index'));
        if (action === 'plan-ex-sets' && state.planForm.exercises[idx]) {
          state.planForm.exercises[idx].targetSets = Math.max(1, parseInt(el.value, 10) || 3);
        } else if (action === 'plan-ex-reps' && state.planForm.exercises[idx]) {
          state.planForm.exercises[idx].targetReps = el.value;
        } else if (action === 'plan-ex-weight' && state.planForm.exercises[idx]) {
          state.planForm.exercises[idx].targetWeightKg = el.value ? fromDisplayMassToKg(el.value) : '';
        }
      }
    });

    document.addEventListener('change', (e) => {
      const el = e.target;
      if (!el) return;
      const action = el.getAttribute('data-action');
      if (action === 'select-progress-exercise') {
        state.selectedProgressExerciseId = el.value;
        renderApp();
      } else if (action === 'select-measurement-metric') {
        state.selectedMeasurementMetricId = el.value;
        renderApp();
      }
    });

    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.getAttribute('data-action');

      switch (action) {
        case 'switch-tab': {
          state.activeTab = btn.getAttribute('data-tab') || 'today';
          if (state.activeTab === 'workout' && getActiveWorkout()) {
            state.workoutSubTab = 'active';
          }
          renderApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          break;
        }
        case 'set-workout-subtab':
          state.workoutSubTab = btn.getAttribute('data-subtab') || 'plans';
          renderApp();
          break;
        case 'set-progress-subtab':
          state.progressSubTab = btn.getAttribute('data-subtab') || 'strength';
          renderApp();
          break;
        case 'set-progress-range':
          state.progressRangeDays = Number(btn.getAttribute('data-days')) || 28;
          renderApp();
          break;
        case 'set-chart-metric':
          state.progressChartMetric = btn.getAttribute('data-metric') || 'tonnage';
          renderApp();
          break;
        case 'select-date':
          state.selectedDateStr = btn.getAttribute('data-date') || state.todayStr;
          renderApp();
          break;
        case 'toggle-monthly-calendar':
          state.showMonthlyCalendar = !state.showMonthlyCalendar;
          renderApp();
          break;
        case 'cal-prev-month': {
          const d = new Date(state.calendarMonthYear.year, state.calendarMonthYear.month - 1, 1, 12, 0, 0);
          state.calendarMonthYear = { year: d.getFullYear(), month: d.getMonth() };
          renderApp();
          break;
        }
        case 'cal-next-month': {
          const d = new Date(state.calendarMonthYear.year, state.calendarMonthYear.month + 1, 1, 12, 0, 0);
          state.calendarMonthYear = { year: d.getFullYear(), month: d.getMonth() };
          renderApp();
          break;
        }
        case 'resume-active-workout':
          state.activeTab = 'workout';
          state.workoutSubTab = 'active';
          renderApp();
          break;
        case 'open-workout-picker':
          state.workoutPickerModalOpen = true;
          renderApp();
          break;
        case 'close-workout-picker':
          state.workoutPickerModalOpen = false;
          renderApp();
          break;
        case 'start-empty-workout':
          state.workoutPickerModalOpen = false;
          await startWorkoutFromPlan(null, state.selectedDateStr);
          break;
        case 'start-plan-workout': {
          state.workoutPickerModalOpen = false;
          const pId = btn.getAttribute('data-plan-id');
          const dateStr = btn.getAttribute('data-date') || state.selectedDateStr;
          const plan = state.plans.find((p) => p.id === pId);
          if (plan) await startWorkoutFromPlan(plan, dateStr);
          break;
        }
        case 'toggle-set-completed': {
          const active = getActiveWorkout();
          if (!active) break;
          const exIdx = Number(btn.getAttribute('data-ex-index'));
          const sIdx = Number(btn.getAttribute('data-set-index'));
          const setObj = active.exercises?.[exIdx]?.sets?.[sIdx];
          if (setObj) {
            setObj.completed = !setObj.completed;
            await persistActiveWorkout(active);
            renderApp();
          }
          break;
        }
        case 'toggle-set-type': {
          const active = getActiveWorkout();
          if (!active) break;
          const exIdx = Number(btn.getAttribute('data-ex-index'));
          const sIdx = Number(btn.getAttribute('data-set-index'));
          const setObj = active.exercises?.[exIdx]?.sets?.[sIdx];
          if (setObj) {
            setObj.type = setObj.type === 'warmup' ? 'working' : 'warmup';
            await persistActiveWorkout(active);
            renderApp();
          }
          break;
        }
        case 'add-set-to-active-ex': {
          const active = getActiveWorkout();
          if (!active) break;
          const exIdx = Number(btn.getAttribute('data-ex-index'));
          const setType = btn.getAttribute('data-set-type') || 'working';
          const exObj = active.exercises?.[exIdx];
          if (exObj) {
            const lastSet = exObj.sets[exObj.sets.length - 1];
            exObj.sets.push({
              id: generateId('set'),
              type: setType,
              weightKg: lastSet ? lastSet.weightKg : '',
              reps: lastSet ? lastSet.reps : 10,
              timeSec: lastSet ? lastSet.timeSec : 60,
              completed: false
            });
            await persistActiveWorkout(active);
            renderApp();
          }
          break;
        }
        case 'remove-set-row': {
          const active = getActiveWorkout();
          if (!active) break;
          const exIdx = Number(btn.getAttribute('data-ex-index'));
          const sIdx = Number(btn.getAttribute('data-set-index'));
          const exObj = active.exercises?.[exIdx];
          if (exObj && exObj.sets.length > 1) {
            exObj.sets.splice(sIdx, 1);
            await persistActiveWorkout(active);
            renderApp();
          }
          break;
        }
        case 'add-exercise-to-active': {
          const active = getActiveWorkout();
          const sel = document.getElementById('active-add-exercise-select');
          if (!active || !sel) break;
          const catEx = state.exercises.find((e) => e.id === sel.value);
          if (catEx) {
            const hist = getExerciseHistoryAndRecords(catEx.id, state.workouts, true);
            const lastSet = hist.lastEntry?.sets?.[0];
            active.exercises.push({
              id: generateId('wex'),
              exerciseId: catEx.id,
              exerciseName: catEx.name,
              primaryMuscles: catEx.primaryMuscles || ['Inne'],
              secondaryMuscles: catEx.secondaryMuscles || [],
              measureType: catEx.measureType || 'weight_reps',
              targetReps: '8-10',
              skipped: false,
              sets: [
                {
                  id: generateId('set'),
                  type: 'working',
                  weightKg: lastSet?.weightKg ?? '',
                  reps: lastSet?.reps ?? 10,
                  timeSec: 60,
                  completed: false
                },
                {
                  id: generateId('set'),
                  type: 'working',
                  weightKg: lastSet?.weightKg ?? '',
                  reps: lastSet?.reps ?? 10,
                  timeSec: 60,
                  completed: false
                },
                {
                  id: generateId('set'),
                  type: 'working',
                  weightKg: lastSet?.weightKg ?? '',
                  reps: lastSet?.reps ?? 10,
                  timeSec: 60,
                  completed: false
                }
              ]
            });
            await persistActiveWorkout(active);
            showToast(`Dodano do sesji: ${catEx.name}`);
            renderApp();
          }
          break;
        }
        case 'move-active-ex': {
          const active = getActiveWorkout();
          if (!active) break;
          const idx = Number(btn.getAttribute('data-ex-index'));
          const dir = Number(btn.getAttribute('data-dir'));
          const targetIdx = idx + dir;
          if (targetIdx >= 0 && targetIdx < active.exercises.length) {
            const tmp = active.exercises[idx];
            active.exercises[idx] = active.exercises[targetIdx];
            active.exercises[targetIdx] = tmp;
            await persistActiveWorkout(active);
            renderApp();
          }
          break;
        }
        case 'toggle-skip-active-ex': {
          const active = getActiveWorkout();
          if (!active) break;
          const idx = Number(btn.getAttribute('data-ex-index'));
          if (active.exercises[idx]) {
            active.exercises[idx].skipped = !active.exercises[idx].skipped;
            await persistActiveWorkout(active);
            renderApp();
          }
          break;
        }
        case 'remove-active-ex': {
          const active = getActiveWorkout();
          if (!active) break;
          const idx = Number(btn.getAttribute('data-ex-index'));
          active.exercises.splice(idx, 1);
          await persistActiveWorkout(active);
          renderApp();
          break;
        }
        case 'finish-active-workout':
          await finishActiveWorkout();
          break;
        case 'ask-abandon-workout':
          state.confirmAbandonWorkout = true;
          renderApp();
          break;
        case 'cancel-abandon-workout':
          state.confirmAbandonWorkout = false;
          renderApp();
          break;
        case 'confirm-abandon-workout':
          await abandonActiveWorkout();
          break;
        case 'open-workout-summary':
          state.completedWorkoutSummaryId = btn.getAttribute('data-workout-id');
          renderApp();
          break;
        case 'close-workout-summary':
          state.completedWorkoutSummaryId = null;
          renderApp();
          break;
        case 'ask-delete-workout':
          state.inlineDeleteWorkoutId = btn.getAttribute('data-workout-id');
          renderApp();
          break;
        case 'cancel-delete-workout':
          state.inlineDeleteWorkoutId = null;
          renderApp();
          break;
        case 'confirm-delete-workout': {
          const wId = btn.getAttribute('data-workout-id');
          if (wId) {
            await dbDelete('workouts', wId);
            state.workouts = state.workouts.filter((w) => w.id !== wId);
            state.inlineDeleteWorkoutId = null;
            showToast('Usunięto sesję z historii.');
            renderApp();
          }
          break;
        }
        case 'open-plan-modal':
          state.workoutPickerModalOpen = false;
          state.planMuscleFilter = 'Wszystkie';
          state.planForm = {
            isEdit: false,
            id: generateId('plan'),
            name: '',
            scheduledDays: [1, 3, 5],
            exercises: []
          };
          state.planModalOpen = true;
          renderApp();
          break;
        case 'edit-plan': {
          const pId = btn.getAttribute('data-plan-id');
          const plan = state.plans.find((p) => p.id === pId);
          if (plan) {
            state.planMuscleFilter = 'Wszystkie';
            state.planForm = JSON.parse(JSON.stringify({ ...plan, isEdit: true }));
            state.planModalOpen = true;
            renderApp();
          }
          break;
        }
        case 'close-plan-modal':
          state.planModalOpen = false;
          state.planForm = null;
          renderApp();
          break;
        case 'plan-preset-name':
          syncPlanModalInputs();
          if (state.planForm) {
            state.planForm.name = btn.getAttribute('data-name') || 'Push';
            renderApp();
          }
          break;
        case 'plan-toggle-day': {
          syncPlanModalInputs();
          const day = Number(btn.getAttribute('data-day'));
          if (state.planForm) {
            const arr = state.planForm.scheduledDays || [];
            state.planForm.scheduledDays = arr.includes(day)
              ? arr.filter((d) => d !== day)
              : [...arr, day];
            renderApp();
          }
          break;
        }
        case 'set-plan-muscle-filter':
          syncPlanModalInputs();
          state.planMuscleFilter = btn.getAttribute('data-muscle') || 'Wszystkie';
          renderApp();
          break;
        case 'plan-add-ex': {
          syncPlanModalInputs();
          const sel = document.getElementById('plan-add-ex-select');
          if (sel) addExerciseToPlanFormById(sel.value);
          break;
        }
        case 'plan-quick-add-ex': {
          syncPlanModalInputs();
          const exId = btn.getAttribute('data-exercise-id');
          if (exId) addExerciseToPlanFormById(exId);
          break;
        }
        case 'plan-move-ex': {
          syncPlanModalInputs();
          const idx = Number(btn.getAttribute('data-index'));
          const dir = Number(btn.getAttribute('data-dir'));
          if (state.planForm && state.planForm.exercises) {
            const targetIdx = idx + dir;
            if (targetIdx >= 0 && targetIdx < state.planForm.exercises.length) {
              const tmp = state.planForm.exercises[idx];
              state.planForm.exercises[idx] = state.planForm.exercises[targetIdx];
              state.planForm.exercises[targetIdx] = tmp;
              renderApp();
            }
          }
          break;
        }
        case 'plan-remove-ex': {
          syncPlanModalInputs();
          const idx = Number(btn.getAttribute('data-index'));
          if (state.planForm) {
            state.planForm.exercises.splice(idx, 1);
            renderApp();
          }
          break;
        }
        case 'save-plan-modal': {
          syncPlanModalInputs();
          const pf = state.planForm;
          if (!pf || !pf.name.trim()) {
            showToast('Podaj nazwę planu treningowego.');
            break;
          }
          const record = {
            id: pf.id,
            name: pf.name.trim(),
            scheduledDays: pf.scheduledDays || [],
            exercises: pf.exercises || [],
            archived: false,
            updatedAt: Date.now()
          };
          await dbPut('plans', record);
          const idx = state.plans.findIndex((p) => p.id === record.id);
          if (idx >= 0) state.plans[idx] = record;
          else state.plans.push(record);
          state.planModalOpen = false;
          state.planForm = null;
          showToast('Zapisano plan treningowy.');
          renderApp();
          break;
        }
        case 'ask-delete-plan':
          state.inlineDeletePlanId = btn.getAttribute('data-plan-id');
          renderApp();
          break;
        case 'cancel-delete-plan':
          state.inlineDeletePlanId = null;
          renderApp();
          break;
        case 'confirm-delete-plan': {
          const pId = btn.getAttribute('data-plan-id');
          if (pId) {
            await dbDelete('plans', pId);
            state.plans = state.plans.filter((p) => p.id !== pId);
            state.inlineDeletePlanId = null;
            showToast('Usunięto plan (historia wykonanych treningów pozostała nienaruszona).');
            renderApp();
          }
          break;
        }
        case 'open-exercise-detail':
          state.exerciseDetailId = btn.getAttribute('data-exercise-id');
          renderApp();
          break;
        case 'close-exercise-detail':
          state.exerciseDetailId = null;
          renderApp();
          break;
        case 'open-exercise-modal':
          state.exerciseForm = {
            name: '',
            category: 'Sztanga',
            primaryMuscle: 'Klatka piersiowa',
            measureType: 'weight_reps',
            cues: ''
          };
          state.exerciseModalOpen = true;
          renderApp();
          break;
        case 'close-exercise-modal':
          state.exerciseModalOpen = false;
          state.exerciseForm = null;
          renderApp();
          break;
        case 'save-exercise-modal': {
          const name = document.getElementById('em-name')?.value.trim();
          const category = document.getElementById('em-category')?.value || 'Sztanga';
          const primaryMuscle = document.getElementById('em-muscle')?.value || 'Klatka piersiowa';
          const measureType = document.getElementById('em-measure')?.value || 'weight_reps';
          const cues = document.getElementById('em-cues')?.value.trim() || '';
          if (!name) {
            showToast('Podaj nazwę ćwiczenia.');
            break;
          }
          const newEx = {
            id: generateId('ex'),
            name,
            category,
            primaryMuscles: [primaryMuscle],
            secondaryMuscles: [],
            measureType,
            cues
          };
          await dbPut('exercises', newEx);
          state.exercises.push(newEx);
          state.exerciseModalOpen = false;
          state.exerciseForm = null;
          showToast('Dodano ćwiczenie do katalogu.');
          renderApp();
          break;
        }
        case 'toggle-favorite-routine': {
          const rId = btn.getAttribute('data-routine-id');
          const r = state.stretchingRoutines.find((x) => x.id === rId);
          if (r) {
            r.favorite = !r.favorite;
            await dbPut('stretching_routines', r);
            renderApp();
          }
          break;
        }
        case 'complete-stretching-routine': {
          const rId = btn.getAttribute('data-routine-id');
          const r = state.stretchingRoutines.find((x) => x.id === rId);
          if (r) {
            const act = {
              id: generateId('act'),
              date: state.selectedDateStr || state.todayStr,
              type: 'Rozciąganie',
              durationMin: r.durationMin || 10,
              note: r.name,
              createdAt: Date.now()
            };
            await dbPut('activities', act);
            state.activities.push(act);
            showToast(`Zapisano wykonanie: ${r.name}`);
            renderApp();
          }
          break;
        }
        case 'open-routine-modal':
          state.routineForm = { name: '', durationMin: 10, description: '', externalUrl: '' };
          state.routineModalOpen = true;
          renderApp();
          break;
        case 'close-routine-modal':
          state.routineModalOpen = false;
          state.routineForm = null;
          renderApp();
          break;
        case 'save-routine-modal': {
          const name = document.getElementById('rm-name')?.value.trim();
          const durationMin = Math.max(1, parseInt(document.getElementById('rm-duration')?.value, 10) || 10);
          const description = document.getElementById('rm-desc')?.value.trim() || '';
          const externalUrl = document.getElementById('rm-url')?.value.trim() || '';
          if (!name) {
            showToast('Podaj nazwę rutyny mobilności.');
            break;
          }
          const rec = {
            id: generateId('str'),
            name,
            durationMin,
            favorite: false,
            assignedDays: [1, 3, 5],
            description,
            externalUrl
          };
          await dbPut('stretching_routines', rec);
          state.stretchingRoutines.push(rec);
          state.routineModalOpen = false;
          state.routineForm = null;
          showToast('Dodano rutynę rozciągania.');
          renderApp();
          break;
        }
        case 'open-activity-modal':
          state.activityForm = {
            date: btn.getAttribute('data-date') || state.selectedDateStr,
            type: 'Spacer',
            durationMin: 45,
            distanceKm: '',
            note: ''
          };
          state.activityModalOpen = true;
          renderApp();
          break;
        case 'close-activity-modal':
          state.activityModalOpen = false;
          state.activityForm = null;
          renderApp();
          break;
        case 'save-activity-modal': {
          const type = document.getElementById('am-type')?.value || 'Spacer';
          const date = document.getElementById('am-date')?.value || state.todayStr;
          const durationMin = Math.max(1, parseInt(document.getElementById('am-duration')?.value, 10) || 30);
          const distRaw = document.getElementById('am-distance')?.value;
          const note = document.getElementById('am-note')?.value.trim() || '';
          const rec = {
            id: generateId('act'),
            date,
            type,
            durationMin,
            distanceKm: distRaw ? Number(distRaw) : undefined,
            note,
            createdAt: Date.now()
          };
          await dbPut('activities', rec);
          state.activities.push(rec);
          state.activityModalOpen = false;
          state.activityForm = null;
          showToast(`Dodano aktywność: ${type}`);
          renderApp();
          break;
        }
        case 'delete-activity-direct': {
          const aId = btn.getAttribute('data-activity-id');
          if (aId) {
            await dbDelete('activities', aId);
            state.activities = state.activities.filter((a) => a.id !== aId);
            showToast('Usunięto wpis aktywności.');
            renderApp();
          }
          break;
        }
        case 'open-measurement-modal':
          state.measurementForm = {
            metricId: state.selectedMeasurementMetricId || 'm_weight',
            date: btn.getAttribute('data-date') || state.selectedDateStr,
            value: '',
            note: ''
          };
          state.measurementModalOpen = true;
          renderApp();
          break;
        case 'close-measurement-modal':
          state.measurementModalOpen = false;
          state.measurementForm = null;
          renderApp();
          break;
        case 'save-measurement-modal': {
          const metricId = document.getElementById('mm-metric')?.value || 'm_weight';
          const date = document.getElementById('mm-date')?.value || state.todayStr;
          const rawVal = document.getElementById('mm-value')?.value;
          const note = document.getElementById('mm-note')?.value.trim() || '';
          const num = Number(String(rawVal).replace(',', '.'));
          if (!rawVal || Number.isNaN(num) || num <= 0) {
            showToast('Podaj prawidłową wartość pomiaru.');
            break;
          }
          const metricObj = getAllMeasurementMetrics().find((m) => m.id === metricId);
          const canonicalVal =
            metricObj?.category === 'mass'
              ? fromDisplayMassToKg(num, state.settings.massUnit)
              : num;

          const rec = {
            id: generateId('meas'),
            metricId,
            metricName: metricObj?.name || 'Pomiar',
            date,
            value: canonicalVal,
            unit: metricObj?.baseUnit || 'cm',
            note,
            createdAt: Date.now()
          };
          await dbPut('measurements', rec);
          state.measurements.push(rec);
          state.selectedMeasurementMetricId = metricId;
          state.measurementModalOpen = false;
          state.measurementForm = null;
          showToast(`Zapisano pomiar: ${rec.metricName}`);
          renderApp();
          break;
        }
        case 'delete-measurement-direct': {
          const mId = btn.getAttribute('data-measurement-id');
          if (mId) {
            await dbDelete('measurements', mId);
            state.measurements = state.measurements.filter((m) => m.id !== mId);
            showToast('Usunięto pomiar.');
            renderApp();
          }
          break;
        }
        case 'open-goal-modal':
          state.goalForm = { title: '3 treningi siłowe w tygodniu', type: 'weekly_workouts', targetValue: 3 };
          state.goalModalOpen = true;
          renderApp();
          break;
        case 'close-goal-modal':
          state.goalModalOpen = false;
          state.goalForm = null;
          renderApp();
          break;
        case 'save-goal-modal': {
          const title = document.getElementById('gm-title')?.value.trim();
          const type = document.getElementById('gm-type')?.value || 'weekly_workouts';
          const targetValue = Number(document.getElementById('gm-target')?.value) || 3;
          if (!title) {
            showToast('Podaj nazwę celu.');
            break;
          }
          const rec = { id: generateId('goal'), title, type, targetValue, createdAt: Date.now() };
          await dbPut('goals', rec);
          state.goals.push(rec);
          state.goalModalOpen = false;
          state.goalForm = null;
          showToast('Zapisano cel.');
          renderApp();
          break;
        }
        case 'delete-goal-direct': {
          const gId = btn.getAttribute('data-goal-id');
          if (gId) {
            await dbDelete('goals', gId);
            state.goals = state.goals.filter((g) => g.id !== gId);
            renderApp();
          }
          break;
        }
        case 'open-settings-modal':
          state.settingsModalOpen = true;
          renderApp();
          break;
        case 'close-settings-modal':
          state.settingsModalOpen = false;
          renderApp();
          break;
        case 'set-theme':
          await updateSettings({ theme: btn.getAttribute('data-theme') || 'system' });
          break;
        case 'toggle-dark-switch':
          await updateSettings({ theme: isDarkActive() ? 'light' : 'dark' });
          break;
        case 'set-mass-unit':
          await updateSettings({ massUnit: btn.getAttribute('data-unit') === 'lb' ? 'lb' : 'kg' });
          break;
        case 'set-dist-unit':
          await updateSettings({ distanceUnit: btn.getAttribute('data-unit') === 'mi' ? 'mi' : 'km' });
          break;
        case 'toggle-exclude-warmups':
          await updateSettings({ excludeWarmups: state.settings.excludeWarmups === false });
          break;
        case 'export-json': {
          const payload = {
            schemaVersion: DB_VERSION,
            exportedAt: new Date().toISOString(),
            app: 'Forma',
            exercises: state.exercises,
            plans: state.plans,
            workouts: state.workouts,
            activities: state.activities,
            stretchingRoutines: state.stretchingRoutines,
            measurements: state.measurements,
            customMetrics: state.customMetrics,
            goals: state.goals,
            settings: state.settings
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `forma-kopia-${state.todayStr}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('Pobrano kopię zapasową JSON.');
          break;
        }
        case 'import-json-trigger':
          document.getElementById('backup-file-input')?.click();
          break;
        case 'cancel-import-json':
          state.pendingBackupImport = null;
          renderApp();
          break;
        case 'confirm-import-json':
          if (state.pendingBackupImport) {
            await dbRestoreBackup(state.pendingBackupImport);
            state.pendingBackupImport = null;
            await loadAllData();
            showToast('Pomyślnie odtworzono dane z kopii JSON.');
          }
          break;
        case 'export-csv-workouts':
          exportWorkoutsToCSV();
          showToast('Pobrano plik CSV (Treningi i serie).');
          break;
        case 'export-csv-measurements':
          exportMeasurementsAndActivitiesToCSV();
          showToast('Pobrano plik CSV (Pomiary i aktywności).');
          break;
        case 'ask-clear-all-data':
          state.confirmClearAllData = true;
          renderApp();
          break;
        case 'cancel-clear-all-data':
          state.confirmClearAllData = false;
          renderApp();
          break;
        case 'confirm-clear-all-data':
          await dbClearAllData();
          state.confirmClearAllData = false;
          await loadAllData();
          showToast('Wyczyszczono wszystkie dane treningowe i przywrócono katalog bazowy.');
          break;
        case 'run-unit-tests':
          state.unitTestResults = runBuiltInUnitTests();
          renderApp();
          break;
        case 'hide-unit-tests':
          state.unitTestResults = null;
          renderApp();
          break;
      }
    });

    document.getElementById('backup-file-input')?.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      e.target.value = '';
      if (!file) return;
      try {
        const text = await file.text();
        const raw = JSON.parse(text);
        state.pendingBackupImport = validateBackupPayload(raw);
        renderApp();
      } catch (err) {
        showToast(err instanceof Error ? err.message : 'Nieprawidłowy plik kopii zapasowej JSON.');
      }
    });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (state.settings.theme === 'system') applyTheme();
    });

    initPWA();
    loadAllData();
  </script>
</body>
</html>
